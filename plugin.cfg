[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Skoda Connect Plugin Authors
EMAIL=skodaconnect@users.noreply.github.com

[PLUGIN]
VERSION=0.9.8
NAME=skodaconnect
FOLDER=skodaconnect
TITLE=Skoda Connect

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository - ausdruecklich nicht ueber
# das Vorgaengerrepository von M. Schlenstedt. Das steht auf 0.2.0 und ist im
# LoxBerry-Wiki als End of Life gekennzeichnet; ein Downgrade dorthin waere
# besonders unschoen (Hausregel, belegt am Docker-Plugin).
#
# Die Fassung bleibt bewusst in der Reihe 0.9.x: solange nichts an einem echten
# Konto und Fahrzeug erprobt ist, gibt es keine 1.0.0. Angeboten wird ein Update
# nur, wenn die Fassung im Zweig hoeher steht als die installierte.
#
# Die Adressen tragen seit 0.9.3 den neuen Repo-Namen. GitHub leitet nach einer
# Umbenennung zwar weiter - auch raw.githubusercontent.com, nachgeprueft -, aber
# ein Weiterleitungsziel ist nichts, worauf sich ein Auto-Update stuetzen
# sollte: Es verschwindet, sobald jemand den alten Namen neu vergibt.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Skoda-Connect-NG/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Skoda-Connect-NG/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
