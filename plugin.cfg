[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Skoda Connect Plugin Authors
EMAIL=skodaconnect@users.noreply.github.com

[PLUGIN]
VERSION=0.9.0
NAME=skodaconnect
FOLDER=skodaconnect
TITLE=Skoda Connect

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository - ausdruecklich nicht ueber
# das Vorgaengerrepository von M. Schlenstedt. Das steht auf 0.2.0 und ist im
# LoxBerry-Wiki als End of Life gekennzeichnet; ein Downgrade dorthin waere
# besonders unschoen (Hausregel, belegt am Docker-Plugin).
#
# Die Fassung steht bewusst auf 0.9.0: solange nichts an einem echten Konto und
# Fahrzeug erprobt ist, wird niemandem ein Update angeboten (0.9.0 = 0.9.0).
# Sobald 1.0.0 erscheint, greift die Aktualisierung von selbst.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-SkodaConnect/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-SkodaConnect/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
