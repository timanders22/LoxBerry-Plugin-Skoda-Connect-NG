M_ZIEL_WO="Ziel %s: Zonen / Gerät / Raum abgewiesen - höchstens 200 Zeichen ohne Steuerzeichen; beim Music Server und der Adressvorlage Zonennummern wie 1,3."
M_ZIEL_OHNE_WO="Ziel %s: bei Sonos bitte die Zone bzw. den Raum eintragen."
M_ZIEL_LAUT="Ziel %s: Lautstärke abgewiesen - leer oder 1 bis 100."
M_ZIEL_SPRACHE="Ziel %s: Sprache abgewiesen – zulässig sind zwei Kleinbuchstaben nach ISO 639-1, z. B. de, en, fr, it, es, nl; bei Sonos (SonoX) auch mit Land, z. B. de-at, en-gb. Leer = wie Ziel 1."
M_ZIEL_OHNE_TOKEN="Ziel %s: für dieses Ausgabegerät ist kein Sprechtoken gespeichert - bitte oben eintragen."
M_ZIEL_DOPPELT="Ziel %s: dasselbe Gerät mit demselben Ort steht schon als anderes Ziel da - die Ansage käme zweimal."
