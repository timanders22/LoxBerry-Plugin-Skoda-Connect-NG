ZIEL_WO_HINWEIS="Zonen / Gerät / Raum je nach Ausgabegerät: Music Server und Adressvorlage Zonennummern wie 1,3 (mehrere Zonen desselben Servers gehören in EIN Ziel); Amazon Echo und Google-Lautsprecher der Gerätename wie im jeweiligen Plugin, eine Liste mit Komma oder gruppe:<Name>, leer = Standardgerät; Sonos (Sonos4Lox) die Zone wie dort (klein, ae/oe/ue/ss); Sonos (SonoX) der Sonos-Raum (SonoX schickt den Text ab Werk an Google). Lautstärke leer = die Vorgabe des Geräts bzw. von Ziel 1. Das Sprechtoken für Amazon Echo bzw. Google-Lautsprecher steht einmal oben und gilt für alle Ziele dieser Art."
L_TEST_ZIEL="Testansage an Ziel %s (%s)"
M_ZIELE="Tabelle der weiteren Ziele abgewiesen: keine Tabelle."
