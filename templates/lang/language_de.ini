M_ZIEL1_AUDIOSERVER="Ziel 1 ist der Original-Audioserver (spricht über Loxone Config); weitere Ziele gehen damit nicht zusammen. Bitte ein anderes Ziel 1 wählen oder die weiteren Ziele ausschalten."
