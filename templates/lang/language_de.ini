WAS_IST_DAS = "<b>Skoda-Fahrzeuge in Loxone – über das MySkoda-Konto.</b> Ein Dienst auf dem LoxBerry holt im eingestellten Takt Ladezustand, Tankfüllstand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster, Klimatisierung, Standort und Servicefristen über die Bibliothek myskoda aus der Skoda-Cloud und legt sie ab. Der Miniserver liest die Werte über virtuelle Eingänge vom Endpunkt des Plugins oder per MQTT über das MQTT-Gateway. Schreibende Befehle (Klimatisierung, Laden, Ladegrenze, Scheibenheizung) sind ab Werk gesperrt."
