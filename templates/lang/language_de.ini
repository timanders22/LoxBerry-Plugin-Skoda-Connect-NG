GATEWAY_ERKLAERUNG = "Der MQTT-Gateway ist seit LoxBerry 3 <b>Bestandteil des Systems</b> und kein Plugin. Er wird nicht nachinstalliert, sondern unter <i>System → MQTT Gateway</i> eingeschaltet."
