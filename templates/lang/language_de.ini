RETAIN_WARNUNG = "<b>Seit 0.9.21 ab Werk ein.</b> Mit dem Haken sendet das Plugin Zustände mit <span class='sm-mono'>retain</span> statt <span class='sm-mono'>publish</span> - das Gateway behält sie, und nach einem Neustart des Brokers oder des Miniservers stehen die virtuellen Eingänge sofort wieder auf ihrem letzten Wert statt minutenlang leer zu bleiben. Entschieden wird je Thema: das Lebenszeichen und Messwerte mit Zeitbezug (Ladeleistung, Ladetempo, Restzeit, Außentemperatur, Ladeempfehlung) gehen nie behalten hinaus, sonst sähe ein alter Wert nach einem Ausfall aktuell aus. Welches Thema behalten wird, steht in der Themenliste unten. Dass der UDP-Eingang des MQTT-Gateways V1 das Befehlswort annimmt, ist am LoxBerry dieses Hauses gemessen (13./14.09.2026) - an Werten dieses Plugins noch nicht, denn es gibt hier kein Fahrzeug."
