MEHRERE_FAHRZEUGE = "Mehrere Fahrzeuge im Konto — je Fahrzeug ein eigener virtueller Eingang:"
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt dann ein passend benannter virtueller Eingang. Der Weg über HTTP verlangt je Wert eine eigene Befehlserkennung, dafür kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anfängt, nimmt MQTT; wer nur wenige Werte braucht, fährt mit HTTP schneller ans Ziel. <b>Das Musterprojekt nutzt die vier HTTP-Vorlagen</b> (Schritt 3 bis 5, Baustein-Listen in Schritt 8). Beide Wege gleichzeitig ergeben dieselben Werte doppelt."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "Darunter je Wert eine <i>Befehlserkennung</i>. Die Vorlage unten legt alle auf einmal an — das ist weniger mühsam und weniger fehleranfällig als das Abtippen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuellen HTTP-Eingang für die Hauptwerte anlegen"
S4_POSITION = "<b>Standort</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>position</span>. Die Anschrift steht in einer zweiten Zeile und ist für Loxone nicht gedacht; die erste Zeile besteht bewusst nur aus Zahlen."
S4_TEXT = "Drei weitere virtuelle HTTP-Eingänge, jeder nach demselben Muster wie Schritt 3. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer — dort stehen dann überall Striche, und das ist richtig so."
S4_TITEL = "Schritt 4: Weitere Eingänge für Laden, Wartung und Standort"
S4_WARTUNG = "<b>Wartung</b> — ein eigener Eingang mit der Aktion <span class='sm-mono'>wartung</span>. Die Wartungswerte holt der Dienst nur jeden N-ten Durchgang (Reiter Einstellungen, „Wartungswerte alle … Takte“); die Vorlage trägt deshalb Takt × N als Abfragezyklus, ab Werk 300 × 24 = 7200 Sekunden. Das Musterprojekt fragt alle 3600 Sekunden – beides genügt, die Werte ändern sich in Tagen."
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. In Loxone Config einen <i>Virtuellen Ausgang</i> mit der unten stehenden Adresse anlegen und darunter je Befehl einen <i>Virtuellen Ausgang Befehl</i>. Im Befehlstext steht <span class='sm-mono'>&lt;v.1&gt;</span> (Temperatur, eine Nachkommastelle) bzw. <span class='sm-mono'>&lt;v.0&gt;</span> (Ladegrenze, ganze Prozent) für den übergebenen Wert."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Zwei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden. <b>Zweitens:</b> Der Dienst wartet nicht auf die Bestätigung des Fahrzeugs. Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt: die Cloud hat den Auftrag angenommen. Ob das Fahrzeug ihn ausgeführt hat, zeigt erst der nächste Abruf — wer sicher sein will, wertet den zurückgelesenen Zustand aus und nicht die Antwort auf den Befehl."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch dieses Token. Es steckt in jeder Adresse, die Sie im Miniserver eintragen — <b>ein neues Token macht alle diese Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie es also nur neu, wenn es tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Das Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Zwei Werte decken das auf: <span class='sm-mono'>OK</span> steht auf 0, sobald der letzte gelungene Abruf älter ist als das Dreifache des Abholtakts, und der Laufzähler <span class='sm-mono'>ZAEHLER</span> zählt bei jedem Durchgang des Dienstes eins weiter. Steht der LoxBerry selbst, kommt keine Antwort mehr – dann bleibt auch <span class='sm-mono'>ALTER</span> auf seinem letzten, kleinen Wert stehen, und nur der stehende Zähler verrät es. Die Seite „Skoda-Connect-NG“ in Schritt 8 prüft ihn mit einer <b>Analogwertvalidierung</b> (Tmc 900 s, dreimal der Takt von 300 s) und meldet „keine frischen Daten“ ODER „Lebenszeichen fehlt“ nach 600 s – ein einzelner verpasster Durchgang löst noch keine Meldung aus."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_MEHRERE = "Es sind <b>%d Fahrzeuge</b> bekannt. Die Namen der Eingänge und Ausgangsbefehle in den Tabellen oben tragen die Nummer des ERSTEN - für jedes weitere tritt an ihre Stelle dessen Nummer, genau wie in den Adressen in Schritt 3 und in der erzeugten Importdatei. Die Seiten werden je Fahrzeug einmal nachgebaut; „Jetzt abrufen“ gilt für alle und steht nur einmal."
S8_TEXT = "Vier Seiten, wie sie im LoxBerry-Plugins Musterprojekt fertig verbunden stehen: Überwachung, Laden, Klima und Befehle, Fahrzeug. Je Seite ein Kasten „So übernehmen Sie diese Seite“, die Tabelle (eine Zeile je Baustein; Loxone Config führt alle in der Baustein-Suche, Taste F5), Hinweise und ein Bild. Keine Leitung geht über eine Seitengrenze; Eingänge, die auf zwei Seiten stehen, sind dort weitere Instanzen. Wer nur überwachen will, übernimmt die erste und die letzte Seite."
S8_TITEL = "Schritt 8: Baustein-Listen aus dem Musterprojekt (vier Seiten)"
S9_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die beiden anderen müssen <b>abgewiesen</b> werden — wenn nicht, ist etwas an der Absicherung falsch."
S9_TITEL = "Schritt 9: Gegenprobe"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. Alle bisher im Miniserver eingetragenen Adressen sind damit ungültig und müssen nachgetragen werden."
T_ADRESSE = "Adresse"
T_BAUSTEIN = "Baustein (Typ)"
T_BEDEUTUNG = "Bedeutung"
T_BEFEHL = "Befehlserkennung"
T_EINGAENGE = "Eingänge verbinden mit"
T_EINHEIT = "Einheit"
T_ERWARTUNG = "Erwartete Antwort"
T_NAMENSVORSCHLAG = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_PRUEFUNG = "Aufruf"
T_TITEL = "Bezeichnung"
T_TOKEN = "Token dieses Plugins"
T_VA_ADRESSE = "Adresse des virtuellen Ausgangs"
T_ZYKLUS = "Abfragezyklus"
VA_HINWEIS = "<span class='sm-mono'>&lt;v.1&gt;</span> und <span class='sm-mono'>&lt;v.0&gt;</span> setzt Loxone durch den Wert des Ausgangs, mit einer bzw. ohne Nachkommastelle: das Plugin nimmt die Temperatur nur in halben Grad (21, 21.5) und die Ladegrenze nur als ganze Zahl. Bei <span class='sm-mono'>abruf</span> entfällt die Fahrzeugnummer - der Sofortabruf gilt für alle. Fertig zum Einlesen gibt es das im Schritt darüber über die Vorlage <b>Befehle</b>."

[BAUSTEIN]
SEITE1_H1 = "<b>Zu Nr. 14:</b> steht der LoxBerry oder der Dienst, behalten alle Eingänge ihren letzten Wert – nur der stehende Laufzähler verrät es. Kommt innerhalb Tmc (900 s) kein neuer Wert, meldet die Analogwertvalidierung an ihrem Ausgang E. SKODA_1_ZAEHLER an V, die Konstante 1 an En – und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen."
SEITE1_H2 = "<b>Zu Nr. 15 bis 18:</b> „keine frischen Daten“ (OK = 0) und „Lebenszeichen fehlt“ laufen über ein ODER in eine Benachrichtigung – ein Benachrichtigungsbaustein bekommt nur eine Quelle. Die Einschaltverzögerung von 600 s lässt einen Neustart und einen einzelnen Fehlabruf still."
SEITE1_H3 = "<b>Zu Nr. 20 und 22:</b> vor dem ersten Wert steht ein Eingang auf 0, und ein Verbrenner liefert nie einen Ladestand. Die Formel macht aus 0 „nicht geliefert“ (Ladestand 100 %, Reichweite 999 km) – sonst meldete die Seite gleich nach dem Import „Ladestand niedrig“."
SEITE1_H4 = "<b>Zu Nr. 21 bis 26:</b> ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung vor der Meldung schluckt ihn. Steckt das Ladekabel, meldet nichts (UND mit negiertem Eingang I2)."
SEITE1_H5 = "<b>Zu Nr. 29 bis 31:</b> „Meldung Ladung beendet“ kommt bei jedem Ladeende nach mindestens einer Minute Laden – auch beim Kabelziehen und bei jeder Pause von „Laden nach Empfehlung“. Wer das nicht will, setzt davor ein UND, dessen Eingang I2 „Empfehlung hält an (Skoda)“ bekommt und negiert wird (auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis)."
SEITE1_H6 = "Zweites Fahrzeug: im Reiter „Einbindung in Loxone“ Fahrzeug 2 wählen und die Vorlagen holen (SKODA_2_…), die vier Seiten kopieren und Eingänge und Ausgangsbefehle durch die SKODA_2_-Gegenstücke ersetzen; Benachrichtigungen je Fahrzeug eigen. „Jetzt abrufen“ gilt für alle Fahrzeuge und steht nur einmal."
SEITE1_H7 = "Nach „Neues Token würfeln“ die Adressen an allen vier Behältern erneuern (oder die Vorlagen neu holen – dann alle Leitungen neu ziehen)."
SEITE1_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ den Skoda-Zugang (Benutzername und Passwort der MySkoda-App) eintragen, speichern und den Dienst starten. Für die Seiten „Skoda-Connect-NG Laden“ und „Skoda-Connect-NG Klima und Befehle“ dort auch den Haken „Schreibende Befehle zulassen“ setzen (ab Werk aus – ohne ihn tun alle Tasten nichts) und den Heimatort eintragen. Probe: die erste Adresse aus Schritt 9 dieses Reiters zeigt im Browser „SKODA;OK=1;SOC=…“."
SEITE1_SCHRITT2 = "In Schritt 3 dieses Reiters Fahrzeug 1 wählen, Art „Status (Hauptwerte)“, Knopf „Vorlage für Loxone Config herunterladen“; ebenso die Arten „Laden“, „Wartung“ und „Befehle (Virtueller Ausgang)“. In Loxone Config: Virtuelle Eingänge anwählen → Vordefinierte HTTP-Geräte → Vorlage importieren (die drei Eingangsdateien); Virtuelle Ausgänge anwählen → Vordefinierte Geräte → Vorlage importieren (die Befehlsdatei). Jede Datei nur EINMAL einlesen (zweimal ergibt doppelte Eingänge). Die vier Behälter „Skoda 1“, „Skoda 1 laden“, „Skoda 1 wartung“ und „Skoda 1 Befehle“ dienen allen vier Seiten; die Befehlsdatei enthält das Token – nicht weitergeben."
SEITE1_SCHRITT3 = "Seite „Skoda-Connect-NG“ anlegen. Aus „Skoda 1“ die Befehle Nr. 1–8 ziehen, aus „Skoda 1 laden“ Nr. 9–12, dazu die Konstante „Konstante 1“ (Nr. 13, Wert 1; im Musterprojekt schon vorhanden)."
SEITE1_SCHRITT4 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Auto gestört (Skoda)“, „Meldung Ladestand niedrig (Skoda)“ und „Meldung Ladung beendet (Skoda)“, Text aus der Tabelle, auf die Seite ziehen."
SEITE1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden; ODER und UND haben je zwei Eingänge. Analogwertvalidierung Nr. 14: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an, und die Ausfallmeldung löst nie aus). UND Nr. 25: Eingang I2 negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Flankenerkennung Nr. 30: die Benachrichtigung Nr. 31 an den Ausgang Off. Status Nr. 19: vorher zweimal „+“ (V5, V6), Status Nr. 28: viermal „+“ (V5–V8). Statuszeilen und Mitteilungstexte stehen in der Tabelle und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt. „Statistik“ an SKODA_1_SOC und SKODA_1_REICHW einschalten."
SEITE1_SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (Skoda)“ zeigt „läuft – Daten … s alt“, und SKODA_1_ZAEHLER zählt alle 5 Minuten weiter."
SEITE2_H1 = "Wer mit einer Wallbox über EVCC lädt, lässt den Schalter Nr. 14 aus: EVCC regelt das Laden selbst (Seiten „EVCC“, „EVCC Ladepunkt 1“, „EVCC Steuerung“). Zwei Regler für dieselbe Ladung widersprechen sich."
SEITE2_H2 = "Das Plugin entscheidet nicht, es empfiehlt: geladen wird erst, wenn der Schalter an ist, das Auto zu Hause steht und die Empfehlung 10 Minuten anhält (Nr. 17 – auch gegen die Befehlsbremse von 30 Befehlen je Stunde). Endet die Empfehlung, wird angehalten. Ohne eingetragenen Heimatort oder ohne Thema bleibt Nr. 15 aus, dann startet nichts."
SEITE2_H3 = "Ob das Ladekabel steckt, prüft die Freigabe nicht – ob das Auto wirklich lädt, zeigt „Laden (Skoda)“ nach dem nächsten Abruf. Ob das Auto einen Befehl ausgeführt hat, zeigt ebenfalls erst der nächste Abruf (die Antwort sagt nur: die Cloud hat ihn angenommen)."
SEITE2_H4 = "Die Ladegrenze (Nr. 13) geht als ganze Zahl hinaus (<span class='sm-mono'>&lt;v.0&gt;</span>); Skoda nimmt 50 bis 100 %. Prozentangaben heißen in Namen „(Proz)“, weil Config „%“ in „_“ umwandelt."
SEITE2_SCHRITT1 = "Behälter aus Seite „Skoda-Connect-NG“, Schritt 2 (nicht erneut importieren). Für „Laden nach Empfehlung“ im Plugin Reiter „MQTT“ die Ladeempfehlung einrichten (Thema mit Strompreis oder PV-Überschuss, Grenzwert) und im Reiter „Einstellungen“ den Heimatort; der Haken „Schreibende Befehle zulassen“ muss gesetzt sein."
SEITE2_SCHRITT2 = "Seite „Skoda-Connect-NG Laden“ anlegen. Aus „Skoda 1 laden“ Nr. 1–8 ziehen (Nr. 1 ist eine weitere Instanz von SKODA_1_LADEN_LAEDT), aus „Skoda 1“ Nr. 9 und 10, aus „Skoda 1 Befehle“ die Ausgangsbefehle Nr. 13, 21 und 24. „Statistik“ an SKODA_1_LADEN_LADEKW einschalten."
SEITE2_SCHRITT3 = "Virtuelle Eingänge anlegen: Schieberegler „Ladegrenze (Skoda) (Proz)“ (Nr. 12: 50 bis 100, Schritt 10, Startwert 80), Schalter „Laden nach Empfehlung (Skoda)“ (Nr. 14, ab Werk aus), Tasten „Laden starten (Skoda)“ und „Laden anhalten (Skoda)“ (Nr. 19, 22)."
SEITE2_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (F5), von oben nach unten verbinden. Die Flankenerkennung Nr. 18 (Pd 1 s) hat zwei genutzte Ausgänge: ODER Nr. 20 an On, ODER Nr. 23 an Off. Status „Laden (Skoda)“ (Nr. 11): vorher viermal „+“ (V5–V8). Statuszeilen stehen in der Tabelle und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt."
SEITE2_SCHRITT5 = "Speichern und übertragen. Probe: Kabel stecken – „Laden (Skoda)“ zeigt nach dem nächsten Abruf „Kabel steckt, lädt nicht …“ oder „lädt mit …“."
SEITE3_H1 = "<b>Zu Nr. 11 und 12:</b> SKODA_1_KLIMA_START ist ein Analogbefehl, der die Temperatur trägt (<span class='sm-mono'>&lt;v.1&gt;</span>, eine Nachkommastelle). Die Formel schickt, solange angefordert, die Zieltemperatur aus Nr. 5, sonst -1 – den Wert -1 weist das Plugin ohne Wirkung ab. Eine Taste allein schickte „1 Grad“."
SEITE3_H2 = "Der Schieberegler gilt nur für „Klima jetzt“ und die Schaltuhr. Den Befehl SKODA_1_ZIELTEMPERATUR (setzt die Temperatur im Auto, ohne zu starten) nutzt die Seite nicht."
SEITE3_H3 = "Das Plugin kann zur Abfahrt auch selbst vorklimatisieren (Reiter „MQTT“, Thema eines Abfahrts-Assistenten; gilt für Fahrzeug 1). Dann die Schaltuhr hier nicht zusätzlich einstellen – sonst wird zweimal angefordert."
SEITE3_H4 = "Alle Befehle dieser Seite brauchen den Haken „Schreibende Befehle zulassen“; ohne ihn antwortet das Plugin mit HTTP 403, und der Virtuelle Ausgang merkt davon nichts. Ob das Fahrzeug einen Befehl ausgeführt hat, zeigt erst der nächste Abruf."
SEITE3_H5 = "Fahrzeug wecken nur sparsam: Skoda erlaubt es höchstens dreimal am Tag. „Jetzt abrufen“ geht höchstens alle 60 s und gilt für alle Fahrzeuge."
SEITE3_H6 = "Die Ansage „Klimatisierung beendet“ spricht das Plugin selbst (Reiter „Einstellungen“, ab Werk an) – kein Baustein."
SEITE3_SCHRITT1 = "Behälter aus Seite „Skoda-Connect-NG“, Schritt 2. Der Haken „Schreibende Befehle zulassen“ im Plugin Reiter „Einstellungen“ muss gesetzt sein."
SEITE3_SCHRITT2 = "Seite „Skoda-Connect-NG Klima und Befehle“ anlegen. Aus „Skoda 1“ Nr. 1–3 ziehen, aus „Skoda 1 Befehle“ die Ausgangsbefehle Nr. 12, 14, 16, 18, 20, 22, 24 und 26, dazu „Anwesenheit (eigene Quelle)“ (Nr. 8; im eigenen Projekt aus der eigenen Anwesenheit speisen)."
SEITE3_SCHRITT3 = "Virtuelle Eingänge anlegen: Schieberegler „Zieltemperatur (Skoda)“ (Nr. 5: 16 bis 29, Schritt 0,5, Startwert 21) und acht Tasten (Nr. 6, 13, 15, 17, 19, 21, 23, 25)."
SEITE3_SCHRITT4 = "Schaltuhr „Abfahrt vorklimatisieren (Skoda)“ (Nr. 7) über die Baustein-Suche (F5) setzen und die Schaltzeit eintragen: Montag bis Freitag 06:40–07:00 EIN (20 Minuten vor der eigenen Abfahrt). Ihren Ausgang AQ an den Eingang I1 des UND Nr. 9 legen. Übrige Bausteine über F5; Status „Klima (Skoda)“ (Nr. 4): vorher einmal „+“ (V5)."
SEITE3_SCHRITT5 = "Speichern und übertragen. Probe: „Klima jetzt“ drücken – „Klima (Skoda)“ zeigt sofort „angefordert …“ und nach dem nächsten Abruf „Klimatisierung läuft …“."
SEITE4_H1 = "<b>Zu Nr. 24:</b> während der Fahrt (Zündung an oder fährt) gibt es keine Offen-Meldung – wie bei der Ansage des Plugins; ebenso nicht ohne frische Daten (OK = 0)."
SEITE4_H2 = "<b>Zu Nr. 28:</b> 0 heißt „nicht geliefert“ (Elektroauto: kein Ölservice; vor dem ersten Abruf) – dann rechnet die Meldung nur mit dem anderen Wert. Negative Werte heißen überfällig."
SEITE4_H3 = "<b>Zu Nr. 29 bis 32:</b> die Einschaltverzögerung von 600 s schluckt den kurzen Impuls, den die Schwellwertschalter bei jeder Abfrage geben. Ist eine Warnleuchte dauerhaft an, kommt eine später fällige Wartung nicht als neue Meldung (eine Benachrichtigung meldet nur den Wechsel von Aus auf Ein) – der Status „Wartung (Skoda)“ zeigt beides."
SEITE4_H4 = "Die Wartungswerte holt der Dienst nur jeden 24. Durchgang (Einstellung „Wartungswerte alle … Takte“); die Vorlage „Wartung“ trägt deshalb diesen längeren Abfragezyklus (ab Werk 7200 s), das Musterprojekt fragt alle 3600 s – beides genügt, die Werte ändern sich in Tagen."
SEITE4_H5 = "„Standort und Kilometer (Skoda)“ braucht den Heimatort im Plugin Reiter „Einstellungen“; ohne ihn steht dort „Standort unbekannt“."
SEITE4_H6 = "Die Ansagen „Fahrzeug offen“ und „Licht an“ spricht das Plugin selbst (ab Werk an) – kein Baustein."
SEITE4_SCHRITT1 = "Behälter aus Seite „Skoda-Connect-NG“, Schritt 2 (dort auch „Skoda 1 wartung“)."
SEITE4_SCHRITT2 = "Seite „Skoda-Connect-NG Fahrzeug“ anlegen. Aus „Skoda 1“ Nr. 1–13 ziehen (Nr. 9 und 12 sind weitere Instanzen), aus „Skoda 1 wartung“ Nr. 14–17. „Statistik“ an SKODA_1_KM einschalten."
SEITE4_SCHRITT3 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Fahrzeug offen (Skoda)“ und „Meldung Service fällig (Skoda)“, Text aus der Tabelle."
SEITE4_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (F5), von oben nach unten verbinden; ODER und UND haben je zwei Eingänge – für sechs Quellen fünf ODER (Nr. 19 bis 23). Status „Türen und Fenster (Skoda)“ (Nr. 34): viermal „+“ (V5–V8); „Wartung (Skoda)“ (Nr. 36): einmal „+“ (V5). Statuszeilen und Mitteilungstexte stehen in der Tabelle."
SEITE4_SCHRITT5 = "Speichern und übertragen. Probe: Auto aufschließen und 5 Minuten offen stehen lassen – „Meldung Fahrzeug offen (Skoda)“ kommt (frühestens mit dem nächsten Abruf)."
Z1_01 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_OK | 1 = letzter Abruf dieses Fahrzeugs gelungen und höchstens dreimal so alt wie der Abruftakt (ab Werk 300 s) | —"
Z1_02 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_ZAEHLER | Laufzähler 0 bis 999, eins weiter je Durchgang des Dienstes (ab Werk alle 300 s, auch bei Störung), läuft um – das Lebenszeichen | —"
Z1_03 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_ALTER | Sekunden seit dem letzten gelungenen Abruf dieses Fahrzeugs; 999999 = noch nie abgerufen | —"
Z1_04 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_AUSFAELLE | Zahl der Teilabrufe, die im letzten Durchgang fehlschlugen; 0 = alles kam an | —"
Z1_05 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_ERREICH | 1 = Fahrzeug für die Skoda-Cloud erreichbar, 0 = nicht (Funkloch, Tiefgarage) | —"
Z1_06 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_SOC | Ladezustand der Antriebsbatterie in %%; Statistik ein | —"
Z1_07 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_TANK | Tankfüllstand in %% (nur Verbrenner und Hybrid; beim Elektroauto bleibt er 0) | —"
Z1_08 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1“) | SKODA_1_REICHW | Gesamtreichweite in km; Statistik ein | —"
Z1_09 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1 laden“) | SKODA_1_LADEN_LAEDT | 1 = wird gerade geladen (weitere Instanz, auch auf Seite „Skoda-Connect-NG Laden“) | —"
Z1_10 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1 laden“) | SKODA_1_LADEN_KABEL | 1 = Ladekabel steckt (weitere Instanz) | —"
Z1_11 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1 laden“) | SKODA_1_LADEN_LADEKW | aktuelle Ladeleistung in kW (weitere Instanz) | —"
Z1_12 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Skoda 1 laden“) | SKODA_1_LADEN_RESTMIN | Minuten bis zur eingestellten Ladegrenze (weitere Instanz) | —"
Z1_13 = "Konstante | Konstante 1 | Wert 1 | —"
Z1_14 = "Analogwertvalidierung | Lebenszeichen fehlt (Skoda) | Tmc 900 s (dreimal der Abruftakt von 300 s), Min 0, Max 999; Haken bei ‚En‘ im Eigenschaftsfenster entfernen | V = #2, En = #13"
Z1_15 = "NICHT | Keine frischen Daten (Skoda) | — | I = #1"
Z1_16 = "ODER | Störung (Skoda) | — (keine frischen Daten oder Lebenszeichen fehlt) | I1 = #15, I2 = Ausgang E von #14"
Z1_17 = "Einschaltverzögerung | Störung bestätigt (Skoda) | 600 s (zwei Abfragen; ein Neustart und ein einzelner Fehlabruf melden nichts) | Eingang = #16"
Z1_18 = "Benachrichtigung | Meldung Auto gestört (Skoda) | Text: Skoda Connect – seit 10 Minuten keine frischen Daten vom Fahrzeug, oder der LoxBerry antwortet nicht. In der App den Status „Zustand (Skoda)“ lesen; im Plugin Reiter Logdateien nachsehen | Eingang = #17"
