; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Skoda Connect"
K02 = "Connects Skoda vehicles to Loxone through the MySkoda account: state of charge, fuel level, range, odometer, locking, doors and windows, climate control, location, warning lights and the inspection and oil service intervals. Climate control, charging, charge limit and window heating can be switched if you wish."
K03 = "Successor to a discontinued plugin"
K04 = "The earlier <i>SkodaConnect</i> plugin by M. Schlenstedt is marked <b>EOL</b>: Skoda changed the interface, and the underlying library <i>skodaconnect</i> was explicitly declared „DEPRECATED“ by its own project. This plugin is not an update of it but a rebuild on the free successor library <i>myskoda</i>. No code was taken from the old plugin — it talks to an interface that no longer exists."
K05 = "The prerequisite that trips people up: Python 3.13"
K06 = "From version 2.0.0 onwards <i>myskoda</i> requires <b>Python 3.13 or newer</b>. Debian 12 (Bookworm) ships 3.11, Debian 13 (Trixie) ships 3.13. On a system that is too old the installation aborts with a named message instead of leaving a dead plugin behind. So check <span style='font-family:monospace;'>python3 -V</span> on the LoxBerry before trying it. Even the last older myskoda version (1.2.3) does not help on Debian 12 — it requires 3.12."
K07 = "Credentials"
K08 = "These are the credentials of the <b>MySkoda account</b> — the same ones as in the MySkoda app. They are kept in a file of their own with permissions 0600 and never appear in the Loxone project file. The password is never displayed; the <i>Test</i> tab only shows its length."
K09 = "How to proceed"
K10 = "<b>Settings:</b> enter user name and password, save, then <i>Start service</i>."
K11 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K12 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver. <b>This applies to MQTT&#8209;Gateway&nbsp;V1.</b> From version&nbsp;2 on, the topic group appears in the subscriptions by itself; there is then nothing to enter."
K13 = "<b>Loxone integration:</b> step by step, with four block lists from the LoxBerry plugins sample project – for each page instructions for taking it over, notes and a picture."
K14 = "Polling interval"
K15 = "Do not poll too tightly. The Skoda cloud rejects requests that come too often with HTTP 429, and a car that is constantly woken up costs standby current. Five minutes is a good starting point. If a value is needed immediately, the fetch command is the right way — not a shorter interval."
K16 = "Control"
K17 = "Writing commands are <b>locked</b> by default and have to be released explicitly. Locking and unlocking is deliberately <b>not</b> offered by this plugin. Worth knowing: the service does not wait for the vehicle to confirm. A reply of <i>OK=1</i> means the cloud has accepted the job — whether the vehicle carries it out only shows on the next fetch."
K18 = "What has not been tested"
K19 = "This plugin was built without a Skoda account and without a vehicle. What is untested is therefore whether the login succeeds, whether a given vehicle answers all the endpoints queried and whether the writing commands have the expected effect. If a value stays empty, the <i>View raw data as JSON</i> button on the <i>Test</i> tab shows what the service actually received."
K20 = "Basis"
K21 = "The cloud connection uses the library <i>myskoda</i> of the skodaconnect project (MIT). It is not an official Skoda interface and may change at any time."
K22 = "Moving to a second LoxBerry"
K23 = "The <i>Settings</i> tab offers <b>Back up settings</b> and <b>Restore</b>. The file contains the action token of this installation — without it every field on the second LoxBerry would be correct and the plugin still would not reach the system. Treat it like a password. The username and password of the MySkoda account are only included if you tick <i>Include credentials</i>; the file name then says so. A file containing even a single invalid value is rejected <b>completely</b> — a half-applied configuration would be worse than the old one, and you cannot tell by looking at it."
K24 = "Throttles against the cloud lockout"
K25 = "Skoda rejects excessive requests with HTTP 429. Three throttles live in the <i>Settings</i> tab: a minimum gap between two immediate polls, a maximum number of writing commands per hour, and a lockout for the same command with the same value. This matters most when charging on surplus power, where Loxone often delivers the same setpoint once a second. A throttled command is rejected and reported, not silently swallowed."
K26 = "Why some button presses are rejected"
K27 = "Every form on this page carries a token derived from the action token. It protects against a foreign page issuing commands from the same browser — your browser sends the LoxBerry login automatically. If the page has been open for a very long time and a new token was generated meanwhile, the form token no longer matches: reload once. If there is no action token at all, the guard rejects everything; the token is created the first time the plugin page is opened, whichever tab happens to be active."
K28 = "Failure detection"
K40 = "Gateway V2 and commands via MQTT"
K41 = "With <b>MQTT gateway V2</b> only what is ticked reaches the Miniserver: the table in the <i>MQTT</i> tab lists every data point with the name of the virtual input and whether <i>Noncached</i> is needed; the <i>Test</i> tab checks it. Loxone sends commands as <span style='font-family:monospace;'>publish skoda/befehl/&lt;name&gt; &lt;value&gt;</span> to the output “LoxBerry MQTT-Gateway” – only with the tick <i>Accept commands via MQTT</i> and with <i>Allow write commands</i>. The acknowledgement “accepted” means: handed to the service; debounce and hourly limit apply as on the HTTP path. The HTTP endpoint can be switched off in the same section; after an update it stays on."
K42 = "Pre-conditioning, arrival, charging cost, SignalBot"
K43 = "Everything off by default. Pre-conditioning reads the minutes until departure from <span style='font-family:monospace;'>haus/abfahrt</span> (otherwise the topic entered), sends “climate on” at most twice per departure and counts as done only once Skoda has accepted. A value under <span style='font-family:monospace;'>haus/</span> is valid only while the counter of its source changes live (120 s). Charging cost is only produced for charges at home and stays -1 if the price is missing for more than 10 % of the energy. Messages to SignalBot: the sample project sends the same messages from Loxone as well – switch on only one path, otherwise they arrive twice."
K44 = "<b>Several speakers at once</b> (since 0.9.34, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 0.9.34 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output. <b>Collective topics and cable:</b> Tab <i>MQTT</i> switches <span style='font-family:monospace'>haus/fahrzeug/&lt;name&gt;/…</span> (on by default). The cable warning and the minimum battery for pre-conditioning are with the pre-conditioning settings; unknown values never warn and never block."
K29 = "At the endpoint <i>OK</i> drops to 0 as soon as the last successful poll of a vehicle is older than three times the polling interval; <i>ALTER</i> stays unchanged next to it. Over MQTT, <span style='font-family:monospace;'>fahrzeugN/ok</span> and <span style='font-family:monospace;'>fahrzeugN/ts</span> carry the same statement per vehicle, not retained and on every run. If a vehicle fails, its states remain; if a successful poll does not deliver a field, “-” is sent once, likewise for a vehicle the account no longer holds. Only changes are sent, the full set every 30 minutes. If the prefix changes or MQTT or <i>Retain values</i> is switched off, the service clears the retained values at the broker."
