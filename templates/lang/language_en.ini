GESPEICHERT = "The settings were saved."
HAUS_EINE_QUELLE = "Use only one source: timer in Loxone <b>or</b> this pre-conditioning – otherwise two commands arrive. At most two “climate on” per departure (send – query – send); it counts as done only once Skoda has accepted the order."
HEIM_ERKLAERUNG = "With the home location set, the plugin computes the straight-line distance to the vehicle and provides the fields <span class='sm-mono'>ZUHAUSE</span> (1 or 0) and <span class='sm-mono'>HEIMENTF</span> (metres). Without an entry both stay empty - nothing is claimed."
H_ABFAHRT_FAHRZEUG = "The number from the Settings tab (1 = first vehicle). If it is not in the account, nothing is sent. Up to 0.9.33 it was always vehicle 1."
H_ABFAHRT_THEMA = "A number is expected: minutes until departure. When it drops below the lead time, climate control is requested <b>once</b>; a second time at the earliest an hour later. Preconditioning at departure time applies to vehicle 1."
H_ABSTAND_ABRUF = "The immediate poll (<span class='sm-mono'>aktion=abruf</span>) interrupts the waiting period and starts a full cycle. A Loxone rule firing once a second produced 3600 cloud polls per hour without this throttle. 0 switches it off."
H_ANKUNFT = "Query on arrival"
H_ANKUNFT_EIN = "If a selected person or tag changes live from 0 to 1, the plugin queries the account once – at most once per 30 minutes and only if the data is older than 5 minutes. The query goes through the queue and therefore, like every immediate query, needs <i>Allow write commands</i>. Off by default."
H_ANKUNFT_QUELLE = "Up to four entries, comma-separated: <span class='sm-mono'>tag:&lt;name&gt;</span> (BLE scanner, <span class='sm-mono'>haus/tag/&lt;name&gt;/da</span>) or <span class='sm-mono'>person:&lt;name&gt;</span> (<span class='sm-mono'>haus/anwesenheit/&lt;name&gt;</span>)."
H_ANSAGE = "Speech output (announcements, on by default)"
H_ANSAGE_ANLAESSE = "Events"
H_ANSAGE_ANLAESSE_HILFE = "Each event can be deselected; it only takes effect once an output is chosen above. The test announcement is on the <i>Test</i> tab."
H_BEFEHLE_STUNDE = "Applies as a sliding window over the last hour and counts only commands that were actually sent - a command that failed the value check consumes nothing."
H_BREMSEN = "Throttles against the Skoda cloud lockout"
H_DIENST = "Polling service"
H_EMAIL = "The e-mail address the MySkoda account was created with."
H_EMPF_ALTER = "If the topic stays silent longer than this, the charging hint goes out as <b>0</b> instead of carrying on with the old value. 0 switches the age limit off. The default of 10800 s (three hours) is a chosen bound, not a measurement: a topic carrying an energy price or a PV surplus reports far more often."
H_EMPF_KLEINER = "For an electricity price that is correct: charge when it is below the threshold. For a PV surplus it is the other way round — then remove the tick."
H_ENTPRELLUNG = "When charging on surplus power, Loxone often delivers the same setpoint once a second. 0 switches the debounce off."
H_ERKANNT = "Detected vehicles"
H_HAUS = "House topics (departure, presence, weather)"
H_HAUS_ABFAHRT_EIN = "Reads <span class='sm-mono'>haus/abfahrt/in_min</span> (departure assistant, tick “give departure to other plugins” there). Valid only while <span class='sm-mono'>haus/abfahrt/zaehler</span> changes live (120 s); otherwise the topic above applies as fallback – it is dropped with the next version. Off by default."
H_HAUS_FAHRZEUG_EIN = "On by default. State of charge, range, cable, charging and at home under <span class='sm-mono'>haus/fahrzeug/&lt;name&gt;/…</span> (<span class='sm-mono'>soc</span>, <span class='sm-mono'>reichweite_km</span>, <span class='sm-mono'>kabel</span>, <span class='sm-mono'>laedt</span>, <span class='sm-mono'>zuhause</span> retained, a dash when there is no statement; <span class='sm-mono'>zaehler</span> never retained), so other plugins and Loxone can read a vehicle whatever its make. Independent of the tick above. No location, no VIN. Switching it off clears the topics."
H_HAUS_STROMPREIS_EIN = "During a charge at home the plugin notes the end price from <span class='sm-mono'>haus/strompreis</span> every minute and shows cost and average price after the charge (charges table, topics <span class='sm-mono'>fahrzeug&lt;n&gt;/ladung_kosten</span> and <span class='sm-mono'>ladung_preis</span>). The amount is the reported charging power × time (Skoda reports no battery size); if the price is missing for more than a tenth of the energy, the cost stays -1 – never estimated. Needs the home position. Off by default."
H_HEIM = "Home location"
H_HEIM_KOORD = "Decimal degrees with a dot, for example 51.318339 and 9.489601. Leaving both fields empty switches the home location off."
H_HEIM_RADIUS = "Within this radius the vehicle counts as being at home. Below roughly 100 metres it gets restless: the cloud position is not accurate to the metre."
H_INTERVALL = "Time between two polls. Allowed: 60 to 3600 seconds."
H_KABEL_ABFAHRT_MIN = "0 = no. Only works with pre-conditioning switched on, it supplies the departure time."
H_KONTO = "MySkoda account access"
H_LADEEMPF_QUELLE = "With <i>haus/strompreis</i> the plugin compares the end price of the current hour (spot price plugin, tick “give electricity price to other plugins” there) with the limit above. If the source is silent, the recommendation goes out as 0 – as with the own topic."
H_LADUNGEN = "Charging log"
H_MQTT_RETAIN = "Applies to states. The heartbeat and time-bound measurements are sent without retain even when ticked."
H_MQTT_TOPIC = "Letters, digits, hyphen, underscore and slash are allowed. All topics derive from this prefix, see the MQTT tab."
H_PASSWORT = "Leaving the field empty keeps the stored password. It is never displayed — the Test tab only shows its length."
H_SAMMEL_KABEL = "Cable forgotten"
H_SICHERUNG = "Back up and restore settings"
H_SIGNAL = "Messages to SignalBot"
H_SIGNAL_EIN = "Off by default. The events below can be deselected one by one."
H_SIGNAL_PRAEFIX = "As set in SignalBot (default <span class='sm-mono'>signalbot</span>)."
H_SITZUNG_MERKEN = "After the first login the service stores a session key in a separate file with mode 0600 and uses it instead of sending username and password every time. This spares the login endpoint, which throttles repeated sign-ins. If the key fails, the normal path is taken and this is noted in the log."
H_STEUERUNG = "Write commands"
H_STROMPREIS = "Electricity price and charging cost"
H_TAKT = "Polling interval"
H_TAKT_STAMM = "Model, licence plate, equipment and the vehicle list hardly ever change. With a 300 second interval, 12 means once per hour."
H_TAKT_WARTUNG = "Inspection and oil service change in days, not minutes. With a 300 second interval, 24 means every two hours."
H_TEMP = "Limits for the air conditioning. A value outside them is <b>rejected</b>, not clamped: a silently altered setpoint leads to a car doing something other than what is displayed."
H_VERLAUF_TAGE = "How long the readings for the small daily chart are kept."
H_VORKLIMA_ANWESEND_EIN = "If <span class='sm-mono'>haus/anwesenheit/jemand</span> reports 0 live, pre-conditioning waits (no attempt used). If the source is silent, it behaves as without the tick. Off by default."
H_VORKLIMA_MIN_SOC = "0 = no limit. Below it nothing is sent and no attempt is used up (topic vorklima = 5). If the battery level is unknown, the plugin pre-conditions as before."
H_VORKLIMA_NUR_KABEL = "Off by default. If the cable is not plugged in, nothing is sent (topic vorklima = 6). If it is unknown, the plugin pre-conditions as before."
H_VORKLIMA_WETTER_EIN = "Outside temperature first from Loxone (command <span class='sm-mono'>aussentemp</span> via the command bridge, valid 30 min), otherwise from the vehicle (snapshot at most 60 min old). Between the two limits nothing is conditioned; without a statement it is conditioned. Off by default."
H_WARTEZEIT = "How long the interface waits for the service to answer a command. After that it reports <span class='sm-mono'>OK=2</span> — queued, outcome unknown. No success is reported that nobody has verified."
H_ZUGANG_LOESCHEN = "Removes username, password and S-PIN completely. An empty password field on its own deletes nothing — that would happen by accident far too easily. Anything typed into the fields in the same step is discarded. The service can no longer sign in afterwards."
KARTE = "Open the map (mapatlas.eu): enter the address, copy the numbers under „Decimal degrees“"
KARTE_ZUSAMMEN = "Both numbers may also be pasted here together (e.g. 50.123, 8.456); the plugin splits them when saving."
KEINE_FAHRZEUGE = "No vehicle detected yet. That is normal until the first successful poll: enter the credentials, save, start the service and wait one interval. If the list is still empty afterwards, the reason is in the Test tab and in the log file."
KONTO_ERKLAERUNG = "These are the credentials of your <b>MySkoda account</b> — the same ones you use in the MySkoda app. Not those of a dealer portal, and not the old Skoda Connect ones from before the changeover. They are stored in a separate file with mode 0600, not in the configuration this page displays."
