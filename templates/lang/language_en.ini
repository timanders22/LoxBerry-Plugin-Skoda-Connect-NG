AUTOSTART_EIN_PLUGIN_AUS = "The gateway is set to autostart. Nothing goes out from <b>this plugin</b> nonetheless: the check box <i>Use MQTT</i> above is off. The row <i>This plugin</i> in the table below says the same."
A_EMPFEHLUNG = "The charging recommendation currently reads <b>%s</b>."
