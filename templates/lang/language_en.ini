EINLEITUNG = "Nine steps. Work through them from top to bottom and you end up with a working integration — including the complete block list in step 8."
H_IMPORT = "<b>Loxone Config creates NEW objects on import and overwrites nothing.</b> Importing twice means duplicate blocks - <span class='sm-mono'>SKODA_1_SOC</span> would then exist twice in the project. Create everything in one go, and after a failed attempt check first what is already there."
H_TITEL = "Loxone integration"
H_VORLAGE_ART = "<b>Status</b> is the main template and keeps its previous names, <span class='sm-mono'>SKODA_1_SOC</span> and so on - an existing integration stays valid. The three other input templates carry the type in the name (<span class='sm-mono'>SKODA_1_LADEN_SOC</span>), because SOC, ALTER and OK would otherwise appear more than once. <b>Commands</b> produces a Virtual Output with all twelve commands."
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE = "Download template for Loxone Config"
L_VORLAGE_ART = "Template type"
L_VORLAGE_FZ = "Vehicle"
MEHRERE_FAHRZEUGE = "Several vehicles in the account — one virtual input per vehicle:"
S1_TEXT = "There are two paths, and <b>MQTT is the standard one</b>. The gateway creates the names of the virtual inputs itself; in Loxone a matching virtual input is all you need. The HTTP path requires a command recognition per value, but everything arrives in <b>one</b> request and you can see in the browser what comes back. Start with MQTT; if you only need a few values, HTTP gets you there faster. Both at once works too."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed if you go the MQTT way. The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once — less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose — a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_POSITION = "<b>Location</b> — a separate input using the action <span class='sm-mono'>position</span>. The postal address is on a second line and is not meant for Loxone; the first line deliberately contains numbers only."
S4_TEXT = "Three more virtual HTTP inputs, each built like step 3. The charging input stays empty on a pure combustion car — you will see dashes there, and that is correct."
S4_TITEL = "Step 4: further inputs for charging, servicing and location"
S4_WARTUNG = "<b>Servicing</b> — a separate input using the action <span class='sm-mono'>wartung</span>. A cycle of 3600 seconds is plenty; these values change in days."
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v&gt;</span> stands for the value passed."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Two things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> the service does not wait for the vehicle to confirm. An answer of <span class='sm-mono'>OK=1</span> means the cloud accepted the request. Whether the car carried it out only shows on the next poll — if you need certainty, evaluate the state read back, not the answer to the command."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver — <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it states the age of the snapshot in seconds. Set the threshold <b>well above the polling interval</b> — with a 300 second interval, 900 seconds works well, so a single missed cycle does not raise an alarm."
S7_TITEL = "Step 7: failure detection"
S8_ERLAEUTERUNG = "<p><b>On #13 to #16:</b> the 'vehicle open' message goes through an OR and an on-delay. Both are deliberate. The notification block only fires on a change from off to on; if several sources are wired straight to its input, one permanently active source swallows all the others. The five minute delay prevents a message while you are still loading the boot.</p><p><b>On #17 and #18:</b> two separate threshold switches, because a car supplies either a state of charge or a fuel level — a hybrid supplies both. The value not supplied stays a dash; the corresponding switch then keeps its last state and does not fire.</p><p><b>On #23:</b> the inspection message needs the input from the servicing request (step 4), not the one from the status request.</p><p><b>On #25:</b> the failure detection threshold is deliberately set to three times the polling interval. Set it tighter and every single missed cycle raises an alarm.</p><p><b>On #28 to #33:</b> preheating is optional. The weekly timer defines the intended departure time, the AND with presence prevents heating while you are away, and the pulse generator makes sure the command fires once rather than being sent on every cycle. <b>Loxone time base:</b> seconds since 1 January 2009. If a time block supplies Unix time (values around 1.23 billion), subtract 1230768000.</p><p><b>On #34:</b> optional but useful: a command that switches the air conditioning off again by hand. Without it, it runs until its own timeout.</p><p><b>On #14 — why four sources hang on two inputs there:</b> for AND and OR the number of inputs is a property of the block that Loxone Config sets itself. Add a third input and the next time Config opens the file it removes that input again without a word — deleting every connection that hung on it. What is allowed is hanging several sources on <i>one</i> input; they are OR-combined. On an OR that gives the same result with two inputs. <b>On an AND it would be wrong</b>: there, several sources on one input are OR-combined as well, which turns the AND into an OR without anything reporting it. That is why #30 carries exactly one source per input.</p>"
S8_MEHRERE = "There are <b>%d vehicles</b> known. The names in the column above carry the number of the FIRST one - for every further vehicle its own number takes that place, exactly as in the addresses in step 3 and in the generated import file. The block chain is rebuilt once per vehicle."
S8_TEXT = "One block per row. Loxone Config lists them all in the block search (key F5). Rows 1 to 12 are the virtual inputs from steps 3 and 4 — if you loaded the template, they are already in the tree."
S8_TITEL = "Step 8: complete block list for rebuilding one to one"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> — if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
