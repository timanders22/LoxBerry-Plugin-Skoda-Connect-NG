BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
EINLEITUNG = "Nine steps. Work through them from top to bottom and you end up with a working integration — including the four block lists from the LoxBerry plugins sample project in step 8."
G41_ENDPUNKT_AUS = "This path is switched off – the tick is in the <i>MQTT</i> tab under “Commands from Loxone via MQTT”."
G41_NEUER_WEG = "<b>New since 0.9.34:</b> new installations use <b>MQTT gateway V2</b> (tick the data points, table in the <i>MQTT</i> tab) and the <b>command bridge</b> (template commands via MQTT). The HTTP path below remains for existing installations."
HINWEISE_TITEL = "Notes"
H_IMPORT = "<b>Loxone Config creates NEW objects on import and overwrites nothing.</b> Importing twice means duplicate blocks - <span class='sm-mono'>SKODA_1_SOC</span> would then exist twice in the project. Create everything in one go, and after a failed attempt check first what is already there."
H_TITEL = "Loxone integration"
H_VORLAGE_ART = "<b>Status</b> is the main template and keeps its previous names, <span class='sm-mono'>SKODA_1_SOC</span> and so on - an existing integration stays valid. The three other input templates carry the type in the name (<span class='sm-mono'>SKODA_1_LADEN_SOC</span>), because SOC, ALTER and OK would otherwise appear more than once. <b>Commands</b> produces a Virtual Output with all twelve commands."
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE = "Download template for Loxone Config"
L_VORLAGE_ART = "Template type"
L_VORLAGE_FZ = "Vehicle"
MEHRERE_FAHRZEUGE = "Several vehicles in the account — one virtual input per vehicle:"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "There are two paths, and <b>MQTT is the standard one</b>. The gateway creates the names of the virtual inputs itself; in Loxone a matching virtual input is all you need. The HTTP path requires a command recognition per value, but everything arrives in <b>one</b> request and you can see in the browser what comes back. Start with MQTT; if you only need a few values, HTTP gets you there faster. <b>The sample project uses the four HTTP templates</b> (steps 3 to 5, block lists in step 8). Both paths at once give the same values twice."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed if you go the MQTT way. The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once — less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose — a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_POSITION = "<b>Location</b> — a separate input using the action <span class='sm-mono'>position</span>. The postal address is on a second line and is not meant for Loxone; the first line deliberately contains numbers only."
S4_TEXT = "Three more virtual HTTP inputs, each built like step 3. The charging input stays empty on a pure combustion car — you will see dashes there, and that is correct."
S4_TITEL = "Step 4: further inputs for charging, servicing and location"
S4_WARTUNG = "<b>Servicing</b> — a separate input using the action <span class='sm-mono'>wartung</span>. The service fetches the servicing values only every Nth run (Settings tab, “Service data every … cycles”); the template therefore carries interval × N as polling cycle, by default 300 × 24 = 7200 seconds. The sample project polls every 3600 seconds – both are enough, these values change in days."
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v.1&gt;</span> (temperature, one decimal place) or <span class='sm-mono'>&lt;v.0&gt;</span> (charge limit, whole percent) stands for the value passed."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Two things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> the service does not wait for the vehicle to confirm. An answer of <span class='sm-mono'>OK=1</span> means the cloud accepted the request. Whether the car carried it out only shows on the next poll — if you need certainty, evaluate the state read back, not the answer to the command."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver — <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. Two values reveal it: <span class='sm-mono'>OK</span> drops to 0 as soon as the last successful poll is older than three times the polling interval, and the run counter <span class='sm-mono'>ZAEHLER</span> counts on by one on every run of the service. If the LoxBerry itself stops, no answer arrives any more – then <span class='sm-mono'>ALTER</span> also stays at its last, small value, and only the stopped counter gives it away. The page “Skoda-Connect-NG” in step 8 checks it with a <b>Value Validator</b> (Tmc 900 s, three times the interval of 300 s) and reports “no fresh data” OR “sign of life missing” after 600 s – a single missed run does not raise an alarm yet."
S7_TITEL = "Step 7: failure detection"
S8_MEHRERE = "There are <b>%d vehicles</b> known. The names of the inputs and output commands in the tables above carry the number of the FIRST one - for every further vehicle its own number takes that place, exactly as in the addresses in step 3 and in the generated import file. The pages are rebuilt once per vehicle; “Jetzt abrufen” applies to all and is placed only once."
S8_TEXT = "Four pages, as they stand fully connected in the LoxBerry plugins sample project: monitoring, charging, climate and commands, vehicle. For each page a box “How to take over this page”, the table (one row per block; Loxone Config lists them all in the block search, key F5), notes and a picture. No connection crosses a page boundary; inputs that appear on two pages are further instances there. If you only want to monitor, take over the first and the last page."
S8_TITEL = "Step 8: block lists from the sample project (four pages)"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> — if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
SCHRITTE_TITEL = "How to take over this page"
