T_VA_ADRESSE = "Address of the virtual output"
T_ZYKLUS = "Polling cycle"
VA_HINWEIS = "Loxone replaces <span class='sm-mono'>&lt;v.1&gt;</span> and <span class='sm-mono'>&lt;v.0&gt;</span> with the value of the output, with one or no decimal place: the plugin only accepts the temperature in half degrees (21, 21.5) and the charge limit only as a whole number. For <span class='sm-mono'>abruf</span> the vehicle number is omitted - the immediate poll covers all of them. Ready to import, this is available in the step above via the <b>Commands</b> template."

[BAUSTEIN]
SEITE1_H1 = "<b>On no. 14:</b> if the LoxBerry or the service stops, all inputs keep their last value – only the stopped run counter gives it away. If no new value arrives within Tmc (900 s), the value validator reports at its output E. SKODA_1_ZAEHLER to V, the constant 1 to En – and remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 15 to 18:</b> “no fresh data” (OK = 0) and “sign of life missing” go through one OR into one notification – a notification block gets only one source. The switch-on delay of 600 s keeps a restart and a single failed poll quiet."
SEITE1_H3 = "<b>On no. 20 and 22:</b> before the first value an input stands at 0, and a combustion car never delivers a state of charge. The formula turns 0 into “not delivered” (state of charge 100 %, range 999 km) – otherwise the page would report “Ladestand niedrig” right after the import."
SEITE1_H4 = "<b>On no. 21 to 26:</b> a threshold switch behind a polled input gives a short pulse on every poll; the switch-on delay in front of the message swallows it. While the charging cable is plugged in nothing is reported (AND with inverted input I2)."
SEITE1_H5 = "<b>On no. 29 to 31:</b> “Meldung Ladung beendet” comes at every end of charging after at least one minute of charging – also when the cable is unplugged and at every pause of “Laden nach Empfehlung”. If you do not want that, put an AND in front whose input I2 gets “Empfehlung hält an (Skoda)” and is inverted (click on the input point, afterwards the input shows a small circle)."
SEITE1_H6 = "Second vehicle: choose vehicle 2 in tab “Loxone integration” and fetch the templates (SKODA_2_…), copy the four pages and replace inputs and output commands with their SKODA_2_ counterparts; notifications separately per vehicle. “Jetzt abrufen” applies to all vehicles and is placed only once."
SEITE1_H7 = "After “Roll a new token” renew the addresses at all four containers (or fetch the templates again – then draw all connections again)."
SEITE1_SCHRITT1 = "In the plugin tab “Settings” enter the Skoda credentials (user name and password of the MySkoda app), save and start the service. For the pages “Skoda-Connect-NG Laden” and “Skoda-Connect-NG Klima und Befehle” also set the tick “Allow write commands” there (off by default – without it none of the buttons does anything) and enter the home location. Check: the first address from step 9 of this tab shows “SKODA;OK=1;SOC=…” in the browser."
SEITE1_SCHRITT2 = "In step 3 of this tab choose vehicle 1, type “Status (main values)”, button “Download template for Loxone Config”; likewise the types “Charging”, “Servicing” and “Commands (Virtual Output)”. In Loxone Config: select Virtual Inputs → Predefined HTTP devices → import template (the three input files); select Virtual Outputs → Predefined devices → import template (the command file). Import each file only ONCE (twice gives duplicate inputs). The four containers “Skoda 1”, “Skoda 1 laden”, “Skoda 1 wartung” and “Skoda 1 Befehle” serve all four pages; the command file contains the token – do not pass it on."
SEITE1_SCHRITT3 = "Create the page “Skoda-Connect-NG”. Drag the commands no. 1–8 from “Skoda 1”, no. 9–12 from “Skoda 1 laden”, plus the constant “Konstante 1” (no. 13, value 1; already present in the sample project)."
SEITE1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification): “Meldung Auto gestört (Skoda)”, “Meldung Ladestand niedrig (Skoda)” and “Meldung Ladung beendet (Skoda)”, text from the table, drag them onto the page."
SEITE1_SCHRITT5 = "Place the other blocks with the block search (F5), parameters as in the table, connect from top to bottom; OR and AND have two inputs each. Value Validator no. 14: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0 and the failure message never triggers). AND no. 25: invert input I2 – click on the input point, afterwards the input shows a small circle. Edge Detection no. 30: the notification no. 31 goes to output Off. Status no. 19: click “+” twice first (V5, V6), status no. 28: four times “+” (V5–V8). The status rows and message texts are in the table and are entered by hand, the row without condition last. Switch on “Statistics” at SKODA_1_SOC and SKODA_1_REICHW."
SEITE1_SCHRITT6 = "Save and send to the Miniserver. Check: “Zustand (Skoda)” shows “läuft – Daten … s alt” (running – data … s old), and SKODA_1_ZAEHLER counts on every 5 minutes."
SEITE2_H1 = "If you charge with a wallbox via EVCC, leave switch no. 14 off: EVCC controls charging itself (pages “EVCC”, “EVCC Ladepunkt 1”, “EVCC Steuerung”). Two controllers for the same charging contradict each other."
SEITE2_H2 = "The plugin does not decide, it recommends: charging only starts when the switch is on, the car is at home and the recommendation lasts for 10 minutes (no. 17 – also against the command throttle of 30 commands per hour). When the recommendation ends, charging is stopped. Without a home location or without a topic, no. 15 stays off and nothing starts."
SEITE2_H3 = "The release does not check whether the charging cable is plugged in – whether the car really charges is shown by “Laden (Skoda)” after the next poll. Whether the car carried out a command is likewise only shown by the next poll (the answer only says: the cloud accepted it)."
SEITE2_H4 = "The charge limit (no. 13) is sent as a whole number (<span class='sm-mono'>&lt;v.0&gt;</span>); Skoda accepts 50 to 100 %. Percent values are called “(Proz)” in names because Config turns “%” into “_”."
SEITE2_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2 (do not import again). For “Laden nach Empfehlung” set up the charging recommendation in the plugin tab “MQTT” (topic with electricity price or PV surplus, limit) and the home location in tab “Settings”; the tick “Allow write commands” must be set."
SEITE2_SCHRITT2 = "Create the page “Skoda-Connect-NG Laden”. Drag no. 1–8 from “Skoda 1 laden” (no. 1 is a further instance of SKODA_1_LADEN_LAEDT), no. 9 and 10 from “Skoda 1”, and the output commands no. 13, 21 and 24 from “Skoda 1 Befehle”. Switch on “Statistics” at SKODA_1_LADEN_LADEKW."
SEITE2_SCHRITT3 = "Create virtual inputs: slider “Ladegrenze (Skoda) (Proz)” (no. 12: 50 to 100, step 10, start value 80), switch “Laden nach Empfehlung (Skoda)” (no. 14, off by default), push buttons “Laden starten (Skoda)” and “Laden anhalten (Skoda)” (no. 19, 22)."
SEITE2_SCHRITT4 = "Place the other blocks with the block search (F5), connect from top to bottom. Edge Detection no. 18 (Pd 1 s) has two outputs in use: OR no. 20 at On, OR no. 23 at Off. Status “Laden (Skoda)” (no. 11): click “+” four times first (V5–V8). The status rows are in the table and are entered by hand, the row without condition last."
SEITE2_SCHRITT5 = "Save and send. Check: plug in the cable – after the next poll “Laden (Skoda)” shows “Kabel steckt, lädt nicht …” (cable plugged in, not charging) or “lädt mit …” (charging with)."
SEITE3_H1 = "<b>On no. 11 and 12:</b> SKODA_1_KLIMA_START is an analog command that carries the temperature (<span class='sm-mono'>&lt;v.1&gt;</span>, one decimal place). While requested, the formula sends the target temperature from no. 5, otherwise -1 – the plugin rejects the value -1 without effect. A push button alone would send “1 degree”."
SEITE3_H2 = "The slider only applies to “Klima jetzt” and the schedule. The page does not use the command SKODA_1_ZIELTEMPERATUR (sets the temperature in the car without starting)."
SEITE3_H3 = "The plugin can also precondition by itself for departure (tab “MQTT”, topic of a departure assistant; applies to vehicle 1). Then do not set the schedule here as well – otherwise it is requested twice."
SEITE3_H4 = "All commands on this page need the tick “Allow write commands”; without it the plugin answers with HTTP 403, and the virtual output does not notice. Whether the vehicle carried out a command is only shown by the next poll."
SEITE3_H5 = "Wake the vehicle only sparingly: Skoda allows it at most three times a day. “Jetzt abrufen” works at most every 60 s and applies to all vehicles."
SEITE3_H6 = "The announcement “climate control ended” is spoken by the plugin itself (tab “Settings”, on by default) – no block."
SEITE3_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2. The tick “Allow write commands” in the plugin tab “Settings” must be set."
SEITE3_SCHRITT2 = "Create the page “Skoda-Connect-NG Klima und Befehle”. Drag no. 1–3 from “Skoda 1”, the output commands no. 12, 14, 16, 18, 20, 22, 24 and 26 from “Skoda 1 Befehle”, plus “Anwesenheit (eigene Quelle)” (no. 8; in your own project feed it from your own presence detection)."
SEITE3_SCHRITT3 = "Create virtual inputs: slider “Zieltemperatur (Skoda)” (no. 5: 16 to 29, step 0.5, start value 21) and eight push buttons (no. 6, 13, 15, 17, 19, 21, 23, 25)."
SEITE3_SCHRITT4 = "Place the schedule “Abfahrt vorklimatisieren (Skoda)” (no. 7) with the block search (F5) and enter the switching time: Monday to Friday 06:40–07:00 ON (20 minutes before your own departure). Connect its output AQ to input I1 of the AND no. 9. Other blocks with F5; status “Klima (Skoda)” (no. 4): click “+” once first (V5)."
SEITE3_SCHRITT5 = "Save and send. Check: press “Klima jetzt” – “Klima (Skoda)” immediately shows “angefordert …” (requested) and after the next poll “Klimatisierung läuft …” (climate control running)."
SEITE4_H1 = "<b>On no. 24:</b> while driving (ignition on or moving) there is no open message – as with the announcement of the plugin; likewise not without fresh data (OK = 0)."
SEITE4_H2 = "<b>On no. 28:</b> 0 means “not delivered” (electric car: no oil service; before the first poll) – then the message only uses the other value. Negative values mean overdue."
SEITE4_H3 = "<b>On no. 29 to 32:</b> the switch-on delay of 600 s swallows the short pulse the threshold switches give on every poll. If a warning light stays on permanently, a service falling due later does not come as a new message (a notification only reports the change from off to on) – the status “Wartung (Skoda)” shows both."
SEITE4_H4 = "The service fetches the servicing values only every 24th run (setting “Service data every … cycles”); the template “Servicing” therefore carries this longer polling cycle (7200 s by default), the sample project polls every 3600 s – both are enough, the values change in days."
SEITE4_H5 = "“Standort und Kilometer (Skoda)” needs the home location in the plugin tab “Settings”; without it, it shows “Standort unbekannt” (location unknown)."
SEITE4_H6 = "The announcements “vehicle open” and “lights on” are spoken by the plugin itself (on by default) – no block."
SEITE4_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2 (there also “Skoda 1 wartung”)."
SEITE4_SCHRITT2 = "Create the page “Skoda-Connect-NG Fahrzeug”. Drag no. 1–13 from “Skoda 1” (no. 9 and 12 are further instances), no. 14–17 from “Skoda 1 wartung”. Switch on “Statistics” at SKODA_1_KM."
SEITE4_SCHRITT3 = "Create two notifications (Periphery → Messages → Notification): “Meldung Fahrzeug offen (Skoda)” and “Meldung Service fällig (Skoda)”, text from the table."
SEITE4_SCHRITT4 = "Place the other blocks with the block search (F5), connect from top to bottom; OR and AND have two inputs each – for six sources five ORs (no. 19 to 23). Status “Türen und Fenster (Skoda)” (no. 34): four times “+” (V5–V8); “Wartung (Skoda)” (no. 36): once “+” (V5). The status rows and message texts are in the table."
SEITE4_SCHRITT5 = "Save and send. Check: unlock the car and leave it open for 5 minutes – “Meldung Fahrzeug offen (Skoda)” arrives (at the earliest with the next poll)."
