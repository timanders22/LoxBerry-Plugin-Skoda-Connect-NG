S1_TEXT = "There are two paths, and <b>MQTT is the standard one</b>. The gateway creates the names of the virtual inputs itself; in Loxone a matching virtual input is all you need. The HTTP path requires a command recognition per value, but everything arrives in <b>one</b> request and you can see in the browser what comes back. Start with MQTT; if you only need a few values, HTTP gets you there faster. <b>The sample project uses the four HTTP templates</b> (steps 3 to 5, block lists in step 8). Both paths at once give the same values twice."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "Only needed if you go the MQTT way. The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>command recognition</i> per value. The template below creates them all at once — less tedious and less error-prone than typing them."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No zero is sent on purpose — a zero would be a silent false statement. Loxone keeps the last valid value in that case. That is exactly why the failure detection in step 7 is needed."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. Address and polling cycle:"
S3_TITEL = "Step 3: create a virtual HTTP input for the main values"
S4_POSITION = "<b>Location</b> — a separate input using the action <span class='sm-mono'>position</span>. The postal address is on a second line and is not meant for Loxone; the first line deliberately contains numbers only."
S4_TEXT = "Three more virtual HTTP inputs, each built like step 3. The charging input stays empty on a pure combustion car — you will see dashes there, and that is correct."
S4_TITEL = "Step 4: further inputs for charging, servicing and location"
S4_WARTUNG = "<b>Servicing</b> — a separate input using the action <span class='sm-mono'>wartung</span>. The service fetches the servicing values only every Nth run (Settings tab, “Service data every … cycles”); the template therefore carries interval × N as polling cycle, by default 300 × 24 = 7200 seconds. The sample project polls every 3600 seconds – both are enough, these values change in days."
S5_TEXT = "Only needed if Loxone should trigger something. In Loxone Config create a <i>virtual output</i> with the address below and one <i>virtual output command</i> per command. In the command text <span class='sm-mono'>&lt;v.1&gt;</span> (temperature, one decimal place) or <span class='sm-mono'>&lt;v.0&gt;</span> (charge limit, whole percent) stands for the value passed."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Two things to know beforehand. <b>First:</b> write commands are disabled by default and must be enabled in the Settings tab. <b>Second:</b> the service does not wait for the vehicle to confirm. An answer of <span class='sm-mono'>OK=1</span> means the cloud accepted the request. Whether the car carried it out only shows on the next poll — if you need certainty, evaluate the state read back, not the answer to the command."
S6_TEXT = "The endpoint sits in the unauthenticated area so Loxone can reach it without credentials. It is protected by this token. The token is part of every address you enter in the Miniserver — <b>a new token invalidates all of them at once</b> and has to be updated everywhere. So only roll a new one if it has actually leaked."
S6_TITEL = "Step 6: the token"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. Everything looks normal in the app although nothing has arrived for hours. Two values reveal it: <span class='sm-mono'>OK</span> drops to 0 as soon as the last successful poll is older than three times the polling interval, and the run counter <span class='sm-mono'>ZAEHLER</span> counts on by one on every run of the service. If the LoxBerry itself stops, no answer arrives any more – then <span class='sm-mono'>ALTER</span> also stays at its last, small value, and only the stopped counter gives it away. The page “Skoda-Connect-NG” in step 8 checks it with a <b>Value Validator</b> (Tmc 900 s, three times the interval of 300 s) and reports “no fresh data” OR “sign of life missing” after 600 s – a single missed run does not raise an alarm yet."
S7_TITEL = "Step 7: failure detection"
S8_MEHRERE = "There are <b>%d vehicles</b> known. The names of the inputs and output commands in the tables above carry the number of the FIRST one - for every further vehicle its own number takes that place, exactly as in the addresses in step 3 and in the generated import file. The pages are rebuilt once per vehicle; “Jetzt abrufen” applies to all and is placed only once."
S8_TEXT = "Four pages, as they stand fully connected in the LoxBerry plugins sample project: monitoring, charging, climate and commands, vehicle. For each page a box “How to take over this page”, the table (one row per block; Loxone Config lists them all in the block search, key F5), notes and a picture. No connection crosses a page boundary; inputs that appear on two pages are further instances there. If you only want to monitor, take over the first and the last page."
S8_TITEL = "Step 8: block lists from the sample project (four pages)"
S9_TEXT = "Open these three addresses in a browser. The first must return values, the other two must be <b>rejected</b> — if they are not, something is wrong with the protection."
S9_TITEL = "Step 9: cross-check"
SCHRITTE_TITEL = "How to take over this page"
TOKEN_NEU = "A new token was created. All addresses entered in the Miniserver so far are invalid now and have to be updated."
T_ADRESSE = "Address"
T_BAUSTEIN = "Block (type)"
T_BEDEUTUNG = "Meaning"
T_BEFEHL = "Command recognition"
T_EINGAENGE = "Connect inputs to"
T_EINHEIT = "Unit"
T_ERWARTUNG = "Expected answer"
T_NAMENSVORSCHLAG = "Name (suggestion)"
T_PARAMETER = "Parameters"
T_PRUEFUNG = "Request"
T_TITEL = "Name"
T_TOKEN = "Token of this plugin"
T_VA_ADRESSE = "Address of the virtual output"
T_ZYKLUS = "Polling cycle"
VA_HINWEIS = "Loxone replaces <span class='sm-mono'>&lt;v.1&gt;</span> and <span class='sm-mono'>&lt;v.0&gt;</span> with the value of the output, with one or no decimal place: the plugin only accepts the temperature in half degrees (21, 21.5) and the charge limit only as a whole number. For <span class='sm-mono'>abruf</span> the vehicle number is omitted - the immediate poll covers all of them. Ready to import, this is available in the step above via the <b>Commands</b> template."

[BAUSTEIN]
SEITE1_H1 = "<b>On no. 14:</b> if the LoxBerry or the service stops, all inputs keep their last value – only the stopped run counter gives it away. If no new value arrives within Tmc (900 s), the value validator reports at its output E. SKODA_1_ZAEHLER to V, the constant 1 to En – and remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 15 to 18:</b> “no fresh data” (OK = 0) and “sign of life missing” go through one OR into one notification – a notification block gets only one source. The switch-on delay of 600 s keeps a restart and a single failed poll quiet."
SEITE1_H3 = "<b>On no. 20 and 22:</b> before the first value an input stands at 0, and a combustion car never delivers a state of charge. The formula turns 0 into “not delivered” (state of charge 100 %, range 999 km) – otherwise the page would report “Ladestand niedrig” right after the import."
SEITE1_H4 = "<b>On no. 21 to 26:</b> a threshold switch behind a polled input gives a short pulse on every poll; the switch-on delay in front of the message swallows it. While the charging cable is plugged in nothing is reported (AND with inverted input I2)."
SEITE1_H5 = "<b>On no. 29 to 31:</b> “Meldung Ladung beendet” comes at every end of charging after at least one minute of charging – also when the cable is unplugged and at every pause of “Laden nach Empfehlung”. If you do not want that, put an AND in front whose input I2 gets “Empfehlung hält an (Skoda)” and is inverted (click on the input point, afterwards the input shows a small circle)."
SEITE1_H6 = "Second vehicle: choose vehicle 2 in tab “Loxone integration” and fetch the templates (SKODA_2_…), copy the four pages and replace inputs and output commands with their SKODA_2_ counterparts; notifications separately per vehicle. “Jetzt abrufen” applies to all vehicles and is placed only once."
SEITE1_H7 = "After “Roll a new token” renew the addresses at all four containers (or fetch the templates again – then draw all connections again)."
SEITE1_SCHRITT1 = "In the plugin tab “Settings” enter the Skoda credentials (user name and password of the MySkoda app), save and start the service. For the pages “Skoda-Connect-NG Laden” and “Skoda-Connect-NG Klima und Befehle” also set the tick “Allow write commands” there (off by default – without it none of the buttons does anything) and enter the home location. Check: the first address from step 9 of this tab shows “SKODA;OK=1;SOC=…” in the browser."
SEITE1_SCHRITT2 = "In step 3 of this tab choose vehicle 1, type “Status (main values)”, button “Download template for Loxone Config”; likewise the types “Charging”, “Servicing” and “Commands (Virtual Output)”. In Loxone Config: select Virtual Inputs → Predefined HTTP devices → import template (the three input files); select Virtual Outputs → Predefined devices → import template (the command file). Import each file only ONCE (twice gives duplicate inputs). The four containers “Skoda 1”, “Skoda 1 laden”, “Skoda 1 wartung” and “Skoda 1 Befehle” serve all four pages; the command file contains the token – do not pass it on."
SEITE1_SCHRITT3 = "Create the page “Skoda-Connect-NG”. Drag the commands no. 1–8 from “Skoda 1”, no. 9–12 from “Skoda 1 laden”, plus the constant “Konstante 1” (no. 13, value 1; already present in the sample project)."
SEITE1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification): “Meldung Auto gestört (Skoda)”, “Meldung Ladestand niedrig (Skoda)” and “Meldung Ladung beendet (Skoda)”, text from the table, drag them onto the page."
SEITE1_SCHRITT5 = "Place the other blocks with the block search (F5), parameters as in the table, connect from top to bottom; OR and AND have two inputs each. Value Validator no. 14: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0 and the failure message never triggers). AND no. 25: invert input I2 – click on the input point, afterwards the input shows a small circle. Edge Detection no. 30: the notification no. 31 goes to output Off. Status no. 19: click “+” twice first (V5, V6), status no. 28: four times “+” (V5–V8). The status rows and message texts are in the table and are entered by hand, the row without condition last. Switch on “Statistics” at SKODA_1_SOC and SKODA_1_REICHW."
SEITE1_SCHRITT6 = "Save and send to the Miniserver. Check: “Zustand (Skoda)” shows “läuft – Daten … s alt” (running – data … s old), and SKODA_1_ZAEHLER counts on every 5 minutes."
SEITE2_H1 = "If you charge with a wallbox via EVCC, leave switch no. 14 off: EVCC controls charging itself (pages “EVCC”, “EVCC Ladepunkt 1”, “EVCC Steuerung”). Two controllers for the same charging contradict each other."
SEITE2_H2 = "The plugin does not decide, it recommends: charging only starts when the switch is on, the car is at home and the recommendation lasts for 10 minutes (no. 17 – also against the command throttle of 30 commands per hour). When the recommendation ends, charging is stopped. Without a home location or without a topic, no. 15 stays off and nothing starts."
SEITE2_H3 = "The release does not check whether the charging cable is plugged in – whether the car really charges is shown by “Laden (Skoda)” after the next poll. Whether the car carried out a command is likewise only shown by the next poll (the answer only says: the cloud accepted it)."
SEITE2_H4 = "The charge limit (no. 13) is sent as a whole number (<span class='sm-mono'>&lt;v.0&gt;</span>); Skoda accepts 50 to 100 %. Percent values are called “(Proz)” in names because Config turns “%” into “_”."
SEITE2_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2 (do not import again). For “Laden nach Empfehlung” set up the charging recommendation in the plugin tab “MQTT” (topic with electricity price or PV surplus, limit) and the home location in tab “Settings”; the tick “Allow write commands” must be set."
SEITE2_SCHRITT2 = "Create the page “Skoda-Connect-NG Laden”. Drag no. 1–8 from “Skoda 1 laden” (no. 1 is a further instance of SKODA_1_LADEN_LAEDT), no. 9 and 10 from “Skoda 1”, and the output commands no. 13, 21 and 24 from “Skoda 1 Befehle”. Switch on “Statistics” at SKODA_1_LADEN_LADEKW."
SEITE2_SCHRITT3 = "Create virtual inputs: slider “Ladegrenze (Skoda) (Proz)” (no. 12: 50 to 100, step 10, start value 80), switch “Laden nach Empfehlung (Skoda)” (no. 14, off by default), push buttons “Laden starten (Skoda)” and “Laden anhalten (Skoda)” (no. 19, 22)."
SEITE2_SCHRITT4 = "Place the other blocks with the block search (F5), connect from top to bottom. Edge Detection no. 18 (Pd 1 s) has two outputs in use: OR no. 20 at On, OR no. 23 at Off. Status “Laden (Skoda)” (no. 11): click “+” four times first (V5–V8). The status rows are in the table and are entered by hand, the row without condition last."
SEITE2_SCHRITT5 = "Save and send. Check: plug in the cable – after the next poll “Laden (Skoda)” shows “Kabel steckt, lädt nicht …” (cable plugged in, not charging) or “lädt mit …” (charging with)."
SEITE3_H1 = "<b>On no. 11 and 12:</b> SKODA_1_KLIMA_START is an analog command that carries the temperature (<span class='sm-mono'>&lt;v.1&gt;</span>, one decimal place). While requested, the formula sends the target temperature from no. 5, otherwise -1 – the plugin rejects the value -1 without effect. A push button alone would send “1 degree”."
SEITE3_H2 = "The slider only applies to “Klima jetzt” and the schedule. The page does not use the command SKODA_1_ZIELTEMPERATUR (sets the temperature in the car without starting)."
SEITE3_H3 = "The plugin can also precondition by itself for departure (tab “MQTT”, topic of a departure assistant; applies to vehicle 1). Then do not set the schedule here as well – otherwise it is requested twice."
SEITE3_H4 = "All commands on this page need the tick “Allow write commands”; without it the plugin answers with HTTP 403, and the virtual output does not notice. Whether the vehicle carried out a command is only shown by the next poll."
SEITE3_H5 = "Wake the vehicle only sparingly: Skoda allows it at most three times a day. “Jetzt abrufen” works at most every 60 s and applies to all vehicles."
SEITE3_H6 = "The announcement “climate control ended” is spoken by the plugin itself (tab “Settings”, off by default) – no block."
SEITE3_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2. The tick “Allow write commands” in the plugin tab “Settings” must be set."
SEITE3_SCHRITT2 = "Create the page “Skoda-Connect-NG Klima und Befehle”. Drag no. 1–3 from “Skoda 1”, the output commands no. 12, 14, 16, 18, 20, 22, 24 and 26 from “Skoda 1 Befehle”, plus “Anwesenheit (eigene Quelle)” (no. 8; in your own project feed it from your own presence detection)."
SEITE3_SCHRITT3 = "Create virtual inputs: slider “Zieltemperatur (Skoda)” (no. 5: 16 to 29, step 0.5, start value 21) and eight push buttons (no. 6, 13, 15, 17, 19, 21, 23, 25)."
SEITE3_SCHRITT4 = "Place the schedule “Abfahrt vorklimatisieren (Skoda)” (no. 7) with the block search (F5) and enter the switching time: Monday to Friday 06:40–07:00 ON (20 minutes before your own departure). Connect its output AQ to input I1 of the AND no. 9. Other blocks with F5; status “Klima (Skoda)” (no. 4): click “+” once first (V5)."
SEITE3_SCHRITT5 = "Save and send. Check: press “Klima jetzt” – “Klima (Skoda)” immediately shows “angefordert …” (requested) and after the next poll “Klimatisierung läuft …” (climate control running)."
SEITE4_H1 = "<b>On no. 24:</b> while driving (ignition on or moving) there is no open message – as with the announcement of the plugin; likewise not without fresh data (OK = 0)."
SEITE4_H2 = "<b>On no. 28:</b> 0 means “not delivered” (electric car: no oil service; before the first poll) – then the message only uses the other value. Negative values mean overdue."
SEITE4_H3 = "<b>On no. 29 to 32:</b> the switch-on delay of 600 s swallows the short pulse the threshold switches give on every poll. If a warning light stays on permanently, a service falling due later does not come as a new message (a notification only reports the change from off to on) – the status “Wartung (Skoda)” shows both."
SEITE4_H4 = "The service fetches the servicing values only every 24th run (setting “Service data every … cycles”); the template “Servicing” therefore carries this longer polling cycle (7200 s by default), the sample project polls every 3600 s – both are enough, the values change in days."
SEITE4_H5 = "“Standort und Kilometer (Skoda)” needs the home location in the plugin tab “Settings”; without it, it shows “Standort unbekannt” (location unknown)."
SEITE4_H6 = "The announcements “vehicle open” and “lights on” are spoken by the plugin itself (off by default) – no block."
SEITE4_SCHRITT1 = "Containers from page “Skoda-Connect-NG”, step 2 (there also “Skoda 1 wartung”)."
SEITE4_SCHRITT2 = "Create the page “Skoda-Connect-NG Fahrzeug”. Drag no. 1–13 from “Skoda 1” (no. 9 and 12 are further instances), no. 14–17 from “Skoda 1 wartung”. Switch on “Statistics” at SKODA_1_KM."
SEITE4_SCHRITT3 = "Create two notifications (Periphery → Messages → Notification): “Meldung Fahrzeug offen (Skoda)” and “Meldung Service fällig (Skoda)”, text from the table."
SEITE4_SCHRITT4 = "Place the other blocks with the block search (F5), connect from top to bottom; OR and AND have two inputs each – for six sources five ORs (no. 19 to 23). Status “Türen und Fenster (Skoda)” (no. 34): four times “+” (V5–V8); “Wartung (Skoda)” (no. 36): once “+” (V5). The status rows and message texts are in the table."
SEITE4_SCHRITT5 = "Save and send. Check: unlock the car and leave it open for 5 minutes – “Meldung Fahrzeug offen (Skoda)” arrives (at the earliest with the next poll)."
Z1_01 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_OK | 1 = last poll of this vehicle succeeded and is at most three times as old as the polling interval (300 s by default) | —"
Z1_02 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_ZAEHLER | Run counter 0 to 999, one step per run of the service (every 300 s by default, also during a fault), wraps around – the sign of life | —"
Z1_03 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_ALTER | Seconds since the last successful poll of this vehicle; 999999 = never polled yet | —"
Z1_04 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_AUSFAELLE | Number of partial requests that failed in the last run; 0 = everything arrived | —"
Z1_05 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_ERREICH | 1 = vehicle reachable for the Skoda cloud, 0 = not (no signal, underground car park) | —"
Z1_06 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_SOC | State of charge of the traction battery in %%; statistics on | —"
Z1_07 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_TANK | Fuel level in %% (combustion and hybrid only; stays 0 on an electric car) | —"
Z1_08 = "Virtual HTTP Input Command (template “Skoda 1”) | SKODA_1_REICHW | Total range in km; statistics on | —"
Z1_09 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_LAEDT | 1 = charging right now (further instance, also on page “Skoda-Connect-NG Laden”) | —"
Z1_10 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_KABEL | 1 = charging cable plugged in (further instance) | —"
Z1_11 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_LADEKW | Current charging power in kW (further instance) | —"
Z1_12 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_RESTMIN | Minutes until the set charge limit (further instance) | —"
Z1_13 = "Constant | Konstante 1 | Value 1 | —"
Z1_14 = "Value Validator | Lebenszeichen fehlt (Skoda) | Tmc 900 s (three times the polling interval of 300 s), Min 0, Max 999; remove the tick at ‘En’ in the properties window | V = #2, En = #13"
Z1_15 = "NOT | Keine frischen Daten (Skoda) | — | I = #1"
Z1_16 = "OR | Störung (Skoda) | — (no fresh data or sign of life missing) | I1 = #15, I2 = output E of #14"
Z1_17 = "Switch-On Delay | Störung bestätigt (Skoda) | 600 s (two polls; a restart or a single failed poll reports nothing) | Input = #16"
Z1_18 = "Notification | Meldung Auto gestört (Skoda) | Text: Skoda Connect – no fresh data from the vehicle for 10 minutes, or the LoxBerry does not answer. Read the status “Zustand (Skoda)” in the app; in the plugin look at the tab Log files | Input = #17"
Z1_19 = "Status | Zustand (Skoda) | Rows: V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry or plugin does not answer; open the LoxBerry in the browser, look at the self-check in the plugin tab Test”; V3 >= 999999 “no poll yet – enter the Skoda credentials in the plugin tab Settings and start the service”; V2 = 0 “no fresh data – last successful poll <v3> s ago; look at the plugin tab Log files (credentials, Skoda cloud)”; V4 > 0 “running – <v4> partial requests failed in the last run; data <v3> s old”; V5 = 0 “running – vehicle not reachable for the cloud, values from the last contact (<v3> s old)”; without condition “running – data <v3> s old, run <v6>”; visualisation ON | V1 = output E of #14, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #2"
Z1_20 = "Formula | Ladestand für Meldung (Skoda) | IF(I1>0;I1;100) – a state of charge never reported (0: combustion car or before the first poll) does not count as low | I1 = #6"
Z1_21 = "Threshold Switch | Ladestand niedrig (Skoda) | On 20 / Off 25 (%%; switches on below 20 %%, off again above 25 %%) | Input = #20"
Z1_22 = "Formula | Reichweite für Meldung (Skoda) | IF(I1>0;I1;999) – a range never reported (0) does not count as short | I1 = #8"
Z1_23 = "Threshold Switch | Reichweite gering (Skoda) | On 50 / Off 70 (km; switches on below 50 km, off again above 70 km) | Input = #22"
Z1_24 = "OR | Ladestand oder Reichweite knapp (Skoda) | — | I1 = #21, I2 = #23"
Z1_25 = "AND | Knapp und nicht angesteckt (Skoda) | — (I2 inverted: in Config click on the input point, a small circle appears; while the charging cable is plugged in nothing is reported) | I1 = #24, I2 = #10 (inverted)"
Z1_26 = "Switch-On Delay | Knapp bestätigt (Skoda) | 600 s (swallows the short pulse the threshold switches give on every poll) | Input = #25"
Z1_27 = "Notification | Meldung Ladestand niedrig (Skoda) | Text: Skoda Connect – state of charge below 20 %%, or range below 50 km, and no charging cable plugged in. Please charge or refuel; values in the app under “Ladestand und Reichweite (Skoda)” | Input = #26"
Z1_28 = "Status | Ladestand und Reichweite (Skoda) | Rows: V4 = 1 “charging with <v6.1> kW – battery <v1.0> %%, range <v3.0> km, ready in <v7> min”; V8 = 1 “low – battery <v1.0> %%, fuel <v2.0> %%, range <v3.0> km; please charge or refuel”; V5 = 1 “cable plugged in, not charging – battery <v1.0> %%, range <v3.0> km”; V1 > 0 and V2 > 0 “battery <v1.0> %%, fuel <v2.0> %%, range <v3.0> km”; V2 > 0 “fuel <v2.0> %%, range <v3.0> km”; without condition “battery <v1.0> %%, range <v3.0> km”; visualisation ON | V1 = #6, V2 = #7, V3 = #8, V4 = #9, V5 = #10, V6 = #11, V7 = #12, V8 = #26"
Z1_29 = "Switch-On Delay | Lädt seit einer Minute (Skoda) | 60 s (only real charging counts; a short outlier does not report the end of charging) | Input = #9"
Z1_30 = "Edge Detection | Ladung endet (Skoda) | Pd 1 s; output Off (falling edge) is used | Input = #29"
Z1_31 = "Notification | Meldung Ladung beendet (Skoda) | Text: Skoda Connect – charging has ended (charge limit reached, cable unplugged or aborted). State of charge in the app under “Laden (Skoda)” | Input = output Off of #30"
Z2_01 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_LAEDT | 1 = charging right now (further instance, also on page “Skoda-Connect-NG”) | —"
Z2_02 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_SOC | State of charge of the traction battery in %% (from the charging request) | —"
Z2_03 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_LADEKW | Current charging power in kW; statistics on | —"
Z2_04 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_TEMPO | Range gained per hour in km/h | —"
Z2_05 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_RESTMIN | Minutes until the set charge limit | —"
Z2_06 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_LADEGR | Set charge limit in %% | —"
Z2_07 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_KABEL | 1 = charging cable plugged in | —"
Z2_08 = "Virtual HTTP Input Command (template “Skoda 1 laden”) | SKODA_1_LADEN_REICHWBAT | Range from the battery alone in km | —"
