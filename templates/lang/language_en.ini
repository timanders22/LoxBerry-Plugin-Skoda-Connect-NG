RETAIN_WARNUNG = "<b>On by default since 0.9.21.</b> When ticked, the plugin sends states with <span class='sm-mono'>retain</span> instead of <span class='sm-mono'>publish</span> - the gateway keeps them, and after a restart of the broker or the Miniserver the virtual inputs are back at their last value immediately instead of staying empty for minutes. The decision is made per topic: the heartbeat and time-bound measurements (charging power, charging speed, remaining time, outside temperature, charging hint) are never kept, otherwise an old value would look current after an outage. The topic list below shows which topic is kept. That the UDP input of MQTT gateway V1 accepts the keyword was measured on this household's LoxBerry (13/14 Sep 2026) - not yet with values of this plugin, as there is no car here."
