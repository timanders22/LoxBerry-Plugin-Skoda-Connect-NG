EMPFEHLUNG_ERKLAERUNG = "A topic carrying a number — electricity price or PV surplus — is compared against a threshold. The result appears as the field <span class='sm-mono'>EMPFEHLUNG</span> in the status endpoint and as an MQTT topic. <b>The plugin does not decide, it recommends.</b> Turning that into a charging release happens in Loxone, where you can see it — a plugin that starts charging on its own because a foreign topic carried a value would be a surprise with an electricity bill."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <i>System → MQTT Gateway</i>."
HORCHER_WARNUNG = "<b>Optional and off by default.</b> Both require the library <span class='sm-mono'>paho-mqtt</span> in the virtual environment; without it everything else works unchanged and the self-test says so. The connection uses the broker from the gateway settings and signs in with the user and password stored there. Measured on this household's LoxBerry (17 Sep 2026): sign-in, subscription and receiving a value work, and the charging hint is computed. If the broker rejects the sign-in, the reason is written in words to the log file. Whether pre-conditioning takes effect on the car is unverified - there is none here."
