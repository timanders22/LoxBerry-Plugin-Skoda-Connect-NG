; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Skoda Connect"
K02 = "Bindet Skoda-Fahrzeuge über das MySkoda-Konto an Loxone an: Ladezustand, Tankfüllstand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster, Klimatisierung, Standort, Warnleuchten sowie Inspektions- und Ölservice-Fristen. Auf Wunsch lassen sich Klimatisierung, Ladevorgang, Ladegrenze und Scheibenheizung schalten."
K03 = "Nachfolger eines eingestellten Plugins"
K04 = "Das frühere Plugin <i>SkodaConnect</i> von M. Schlenstedt ist als <b>EOL</b> gekennzeichnet: Skoda hat die Schnittstelle umgestellt, und die zugrunde liegende Bibliothek <i>skodaconnect</i> wurde vom eigenen Projekt ausdrücklich als „DEPRECATED“ erklärt. Dieses Plugin ist kein Update davon, sondern ein Neubau auf der freien Nachfolgebibliothek <i>myskoda</i>. Aus dem alten Plugin wurde kein Code übernommen — er spricht eine Schnittstelle an, die es nicht mehr gibt."
K05 = "Voraussetzung, die stolpern lässt: Python 3.13"
K06 = "<i>myskoda</i> verlangt ab Fassung 2.0.0 <b>Python 3.13 oder neuer</b>. Debian 12 (Bookworm) liefert 3.11, Debian 13 (Trixie) liefert 3.13. Auf einem zu alten System bricht die Installation mit einer benannten Meldung ab, statt ein totes Plugin zu hinterlassen. Vor dem Ausprobieren also <span style='font-family:monospace;'>python3 -V</span> auf dem LoxBerry prüfen. Auch die letzte ältere myskoda-Fassung (1.2.3) hilft auf Debian 12 nicht — sie verlangt 3.12."
K07 = "Zugangsdaten"
K08 = "Es sind die Zugangsdaten des <b>MySkoda-Kontos</b> — dieselben wie in der MySkoda-App. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei. Das Passwort wird nirgends angezeigt; im Reiter <i>Test</i> steht nur seine Länge."
K09 = "So gehen Sie vor"
K10 = "<b>Einstellungen:</b> Benutzername und Passwort eintragen, speichern, dann <i>Dienst starten</i>."
K11 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K12 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K13 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vier Baustein-Listen aus dem LoxBerry-Plugins Musterprojekt – je Seite eine Anleitung zum Übernehmen, Hinweise und ein Bild."
K14 = "Abholtakt"
K15 = "Nicht zu dicht takten. Die Skoda-Cloud weist zu häufige Anfragen mit HTTP 429 ab, und ein ständig geweckter Wagen kostet Ruhestrom. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg — nicht ein kürzerer Takt."
K16 = "Steuerung"
K17 = "Schreibende Befehle sind ab Werk <b>gesperrt</b> und müssen ausdrücklich freigegeben werden. Ver- und Entriegeln bietet dieses Plugin bewusst <b>nicht</b> an. Wichtig zu wissen: der Dienst wartet nicht auf die Bestätigung des Fahrzeugs. Eine Antwort mit <i>OK=1</i> heißt, dass die Cloud den Auftrag angenommen hat — ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf."
K18 = "Was ungeprüft ist"
K19 = "Dieses Plugin wurde ohne Skoda-Konto und ohne Fahrzeug gebaut. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob ein bestimmtes Fahrzeug alle abgefragten Endpunkte beantwortet und ob die schreibenden Befehle die erwartete Wirkung haben. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K20 = "Grundlage"
K21 = "Die Cloud-Anbindung nutzt die Bibliothek <i>myskoda</i> des Projekts skodaconnect (MIT). Sie ist keine amtliche Skoda-Schnittstelle und kann sich jederzeit ändern."
K22 = "Umzug auf einen zweiten LoxBerry"
K23 = "Im Reiter <i>Einstellungen</i> gibt es <b>Einstellungen sichern</b> und <b>Zurückspielen</b>. Die Datei enthält das Aktionstoken dieser Anlage — ohne das stünden auf dem zweiten LoxBerry alle Felder richtig, und das Plugin käme trotzdem nicht an die Anlage. Behandeln Sie sie deshalb wie ein Passwort. Benutzername und Passwort des MySkoda-Kontos gehen nur mit, wenn Sie den Haken <i>Zugangsdaten mitsichern</i> setzen; der Dateiname sagt es dann mit. Eine Datei, die auch nur einen unzulässigen Wert enthält, wird <b>vollständig</b> abgewiesen — eine zur Hälfte übernommene Konfiguration wäre schlimmer als die alte, und man sieht es ihr nicht an."
K24 = "Bremsen gegen die Sperre der Cloud"
K25 = "Skoda weist zu häufige Anfragen mit HTTP 429 ab. Drei Bremsen stehen im Reiter <i>Einstellungen</i>: ein Mindestabstand zwischen zwei Sofortabrufen, eine Höchstzahl schreibender Befehle je Stunde und eine Sperrzeit für denselben Befehl mit demselben Wert. Das ist vor allem beim Überschussladen wichtig, wo Loxone denselben Sollwert oft im Sekundentakt liefert. Ein gebremster Befehl wird abgewiesen und gemeldet, nicht stillschweigend verschluckt."
K26 = "Warum manche Knopfdrücke abgewiesen werden"
K27 = "Jedes Formular dieser Oberfläche trägt ein Merkmal, das aus dem Aktionstoken abgeleitet wird. Es schützt davor, dass eine fremde Seite im selben Browser Befehle absetzt — die Anmeldung des LoxBerry schickt Ihr Browser dabei automatisch mit. Steht die Seite sehr lange offen und wird zwischendurch ein neues Token erzeugt, passt das Merkmal nicht mehr: dann einmal neu laden. Gibt es noch gar kein Aktionstoken, weist der Schutz alles ab; das Token entsteht beim ersten Öffnen der Plugin-Oberfläche, gleich welcher Reiter dabei aufgeht."
K28 = "Ausfallerkennung"
K40 = "Gateway V2 und Befehle über MQTT"
K41 = "Unter <b>MQTT-Gateway V2</b> kommt am Miniserver nur an, was angehakt ist: die Tabelle im Reiter <i>MQTT</i> nennt jeden Datenpunkt mit dem Namen des virtuellen Eingangs und ob <i>Noncached</i> nötig ist; der Reiter <i>Test</i> prüft es. Befehle schickt Loxone als <span style='font-family:monospace;'>publish skoda/befehl/&lt;name&gt; &lt;wert&gt;</span> an den Ausgang „LoxBerry MQTT-Gateway“ – nur mit dem Haken <i>Befehle über MQTT annehmen</i> und mit <i>Schreibende Befehle zulassen</i>. Die Quittung „angenommen“ heißt: an den Dienst übergeben; Entprellung und Stundenbremse gelten wie beim HTTP-Weg. Der HTTP-Endpunkt lässt sich im selben Abschnitt ausschalten; nach einem Update bleibt er an."
K42 = "Vorklimatisierung, Ankunft, Ladekosten, SignalBot"
K43 = "Alles ab Werk aus. Die Vorklimatisierung liest die Minuten bis zur Abfahrt aus <span style='font-family:monospace;'>haus/abfahrt</span> (sonst das eingetragene Thema), sendet höchstens zweimal „Klima ein“ je Abfahrt und gilt erst als erledigt, wenn Skoda angenommen hat. Ein Wert unter <span style='font-family:monospace;'>haus/</span> gilt nur, solange der Zähler seiner Quelle live wechselt (120 s). Die Ladekosten entstehen nur für Ladungen zu Hause und bleiben -1, wenn der Preis für mehr als 10 % der Energie fehlt. Meldungen an SignalBot: das Musterprojekt schickt dieselben Meldungen auch aus Loxone – nur einen Weg einschalten, sonst kommen sie doppelt."
K44 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 0.9.34, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 0.9.34 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück. <b>Sammelthemen und Kabel:</b> Der Reiter <i>MQTT</i> schaltet <span style='font-family:monospace'>haus/fahrzeug/&lt;name&gt;/…</span> (ab Werk an). Kabel-Warnung und Mindest-Akku der Vorklimatisierung stehen bei den Einstellungen der Vorklimatisierung; unbekannte Werte warnen nie und sperren nie."
K29 = "Am Endpunkt steht <i>OK</i> auf 0, sobald der letzte gelungene Abruf eines Fahrzeugs älter ist als das Dreifache des Abruftakts; <i>ALTER</i> steht unverändert daneben. Über MQTT tragen <span style='font-family:monospace;'>fahrzeugN/ok</span> und <span style='font-family:monospace;'>fahrzeugN/ts</span> dieselbe Aussage je Fahrzeug, flüchtig und in jedem Durchgang. Fällt ein Fahrzeug aus, bleiben seine Zustände stehen; liefert ein gelungener Abruf ein Feld nicht, geht einmal „-“ hinaus, ebenso für ein Fahrzeug, das das Konto nicht mehr führt. Gesendet werden nur Änderungen, der volle Satz alle 30 Minuten. Wechselt das Präfix oder wird MQTT oder <i>Werte behalten</i> abgeschaltet, räumt der Dienst die behaltenen Werte am Broker ab."
