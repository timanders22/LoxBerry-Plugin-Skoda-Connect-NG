; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Skoda Connect"
K02 = "Bindet Skoda-Fahrzeuge über das MySkoda-Konto an Loxone an: Ladezustand, Tankfüllstand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster, Klimatisierung, Standort, Warnleuchten sowie Inspektions- und Ölservice-Fristen. Auf Wunsch lassen sich Klimatisierung, Ladevorgang, Ladegrenze und Scheibenheizung schalten."
K03 = "Nachfolger eines eingestellten Plugins"
K04 = "Das frühere Plugin <i>SkodaConnect</i> von M. Schlenstedt ist als <b>EOL</b> gekennzeichnet: Skoda hat die Schnittstelle umgestellt, und die zugrunde liegende Bibliothek <i>skodaconnect</i> wurde vom eigenen Projekt ausdrücklich als „DEPRECATED“ erklärt. Dieses Plugin ist kein Update davon, sondern ein Neubau auf der freien Nachfolgebibliothek <i>myskoda</i>. Aus dem alten Plugin wurde kein Code übernommen — er spricht eine Schnittstelle an, die es nicht mehr gibt."
K05 = "Voraussetzung, die stolpern lässt: Python 3.13"
K06 = "<i>myskoda</i> verlangt ab Fassung 2.0.0 <b>Python 3.13 oder neuer</b>. Debian 12 (Bookworm) liefert 3.11, Debian 13 (Trixie) liefert 3.13. Auf einem zu alten System bricht die Installation mit einer benannten Meldung ab, statt ein totes Plugin zu hinterlassen. Vor dem Ausprobieren also <span style='font-family:monospace;'>python3 -V</span> auf dem LoxBerry prüfen. Auch die letzte ältere myskoda-Fassung (1.2.3) hilft auf Debian 12 nicht — sie verlangt 3.12."
K07 = "Zugangsdaten"
K08 = "Es sind die Zugangsdaten des <b>MySkoda-Kontos</b> — dieselben wie in der MySkoda-App. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei. Das Passwort wird nirgends angezeigt; im Reiter <i>Test</i> steht nur seine Länge."
K09 = "So gehen Sie vor"
K10 = "<b>Einstellungen:</b> Benutzername und Passwort eintragen, speichern, dann <i>Dienst starten</i>."
K11 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K12 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K13 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K14 = "Abholtakt"
K15 = "Nicht zu dicht takten. Die Skoda-Cloud weist zu häufige Anfragen mit HTTP 429 ab, und ein ständig geweckter Wagen kostet Ruhestrom. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg — nicht ein kürzerer Takt."
K16 = "Steuerung"
K17 = "Schreibende Befehle sind ab Werk <b>gesperrt</b> und müssen ausdrücklich freigegeben werden. Ver- und Entriegeln bietet dieses Plugin bewusst <b>nicht</b> an. Wichtig zu wissen: der Dienst wartet nicht auf die Bestätigung des Fahrzeugs. Eine Antwort mit <i>OK=1</i> heißt, dass die Cloud den Auftrag angenommen hat — ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf."
K18 = "Was ungeprüft ist"
K19 = "Dieses Plugin wurde ohne Skoda-Konto und ohne Fahrzeug gebaut. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob ein bestimmtes Fahrzeug alle abgefragten Endpunkte beantwortet und ob die schreibenden Befehle die erwartete Wirkung haben. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K20 = "Grundlage"
K21 = "Die Cloud-Anbindung nutzt die Bibliothek <i>myskoda</i> des Projekts skodaconnect (MIT). Sie ist keine amtliche Skoda-Schnittstelle und kann sich jederzeit ändern."
