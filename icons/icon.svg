<?xml version="1.0" encoding="UTF-8"?>
<!--
  Skoda Connect - Plugin-Symbol

  Hausstandard: runde Scheibe in LoxBerry-Gruen #6dac20, Motiv am echten
  Gegenstand orientiert. Bewusst KEINE fremde Wortmarke und kein Logo, auch
  nicht angedeutet - gezeigt wird eine allgemeine Limousinen-Silhouette und
  darueber die Funkwellen, die fuer die Cloud-Anbindung stehen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <circle cx="64" cy="64" r="64" fill="#6dac20"/>

  <!-- Funkwellen: die Werte kommen ueber die Cloud, nicht aus dem Heimnetz -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M 53 38 A 16 16 0 0 1 75 38"/>
    <path d="M 44 30 A 28 28 0 0 1 84 30"/>
    <path d="M 35 22 A 41 41 0 0 1 93 22"/>
  </g>
  <circle cx="64" cy="45" r="4" fill="#ffffff"/>

  <!-- Karosserie -->
  <path d="M 17 88
           C 17 78 19 74 27 72
           L 40 70
           L 50 56
           C 52 52 55 51 60 51
           L 85 51
           C 90 51 93 53 95 57
           L 102 70
           L 112 72
           C 119 74 120 78 120 88
           Z"
        fill="#ffffff"/>

  <!-- Fenster -->
  <path d="M 58 55 L 68 55 L 68 68 L 48 68 Z" fill="#6dac20"/>
  <path d="M 73 55 L 84 55 L 92 68 L 73 68 Z" fill="#6dac20"/>

  <!-- Radkaesten und Raeder -->
  <circle cx="41" cy="88" r="15" fill="#6dac20"/>
  <circle cx="97" cy="88" r="15" fill="#6dac20"/>
  <circle cx="41" cy="88" r="11" fill="#ffffff"/>
  <circle cx="97" cy="88" r="11" fill="#ffffff"/>
  <circle cx="41" cy="88" r="4.5" fill="#6dac20"/>
  <circle cx="97" cy="88" r="4.5" fill="#6dac20"/>
</svg>
